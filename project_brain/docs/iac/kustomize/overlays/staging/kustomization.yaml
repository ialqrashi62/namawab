apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nama-staging
namePrefix: stg-

resources:
  - ../../base

patches:
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: nama-env
    behavior: merge
    literals:
      - NAMA_ENV=staging
      - LOG_LEVEL=DEBUG
