<script type="module">
const APP={spec:null,yamlText:'',server:'https://jumanasoft.com/api/v1'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const renderSchema=(root,schema,depth=0,name='')=>{if(!schema)return'';if(schema.$ref){const r=resolveRef(root,schema.$ref);return r?renderSchema(root,r,depth,name):`<div class="sch-tree"><span class="d">${esc(schema.$ref)}</span></div>`;}const t=schema.type||(schema.properties?'object':(schema.items?'array':'any'));let h=`<div class="sch-tree">`;if(name)h+=`<span class="k">${esc(name)}</span>: `;h+=`<span class="t">${esc(t)}</span>`;if(schema.format)h+=` <span class="d">&lt;${esc(schema.format)}&gt;</span>`;if(schema.enum)h+=` <span class="d">[enum: ${schema.enum.map(esc).join(', ')}]</span>`;if(schema.example!==undefined)h+=` <span class="d">e.g. ${esc(JSON.stringify(schema.example))}</span>`;if(schema.pattern)h+=` <span class="d">/${esc(schema.pattern)}/</span>`;if(t==='object'&&schema.properties){const req=new Set(schema.required||[]);h+=`<ul>`;for(const[k,v]of Object.entries(schema.properties))h+=`<li>${req.has(k)?'<b style="color:var(--del);">*</b> ':''}${renderSchema(root,v,depth+1,k)}</li>`;h+=`</ul>`;}else if(t==='array'&&schema.items)h+=renderSchema(root,schema.items,depth+1,'[]');h+=`</div>`;return h;};

  const samples=op['x-codeSamples']||[];

  const opId=op.operationId||path.replace(/[^a-z0-9]/gi,'-')+'-'+m;
  const id='op-'+opId;
  return`<article class="endpoint" id="${esc(id)}"><header><span class="method ${m}">${m}</span><span class="path">${esc(path)}</span><span class="sum">${esc(sum)}</span>${op.operationId?`<span class="opid">${esc(op.operationId)}</span>`:''}</header><div class="body">${desc?`<p class="desc">${esc(desc)}</p>`:''}${paramsArr.length?`<details class="coll" open><summary><span class="ms material-symbols-outlined">chevron_right</span>المعاملات · Parameters (${paramsArr.length})</summary><div class="body"><table class="params"><thead><tr><th>الاسم</th><th>النوع</th><th>مطلوب</th><th>الوصف</th><th>مثال</th></tr></thead><tbody>${paramsHtml}</tbody></table></div></details>`:''}${reqBodyHtml}${samplesHtml}${respHtml}<div class="tryit-host" data-tryit-host="${esc(path)}" data-tryit-method="${m}"></div></div></article>`;
};
const renderIntro=(info)=>{const desc=info.description||'';const parts=desc.split(/##\s+/).filter(Boolean);let ar='',en='';for(const p of parts){if(/Arabic|عربي|نظرة/.test(p))ar=p;if(/English|Overview/i.test(p))en=p;}return`<div class="api-intro"><h2>${esc(info.title||'API')} <span class="pill v" style="background:var(--nm-teal);font-size:11px;padding:2px 7px;">${esc(info.version||'')}</span></h2>${ar?`<div class="ar">${esc(ar).replace(/\n/g,'<br>')}</div>`:''}${en?`<div class="en">${esc(en).replace(/\n/g,'<br>')}</div>`:''}<div class="meta"><span><b>OpenAPI:</b> 3.0.3</span><span><b>Server:</b> <span id="introServer">${esc(APP.server)}</span></span></div></div>`;};
const renderSidebar=(root)=>{const tagMap={};for(const[pathStr,methods]of Object.entries(root.paths||{})){for(const[m,op]of Object.entries(methods)){if(!['get','post','put','delete','patch'].includes(m))continue;const tag=(op.tags&&op.tags[0])||'Default';if(!tagMap[tag])tagMap[tag]={name:tag,ops:[]};tagMap[tag].ops.push({path:pathStr,method:m.toUpperCase(),sum:op.summary||'',opId:op.operationId||pathStr});}}let html='';for(const t of Object.values(tagMap)){if(!t||!t.ops||!t.ops.length)continue;html+=`<div class="tag-h">${esc(t.name)} (${t.ops.length})</div><ul>`;for(const o of t.ops){const id='op-'+(o.opId||o.path.replace(/[^a-z0-9]/gi,'-')+'-'+o.method);html+=`<li><a class="nav" href="#${id}" data-q="${esc((o.path+' '+o.sum+' '+o.opId).toLowerCase())}"><span class="m ${o.method}">${o.method}</span><span>${esc(o.path)}</span></a></li>`;}html+=`</ul>`;}return html;};
const setupFilter=()=>{const q=document.getElementById('q');const sides=document.querySelectorAll('aside a.nav');const articles=document.querySelectorAll('article.endpoint');const apply=()=>{const v=(q.value||'').toLowerCase().trim();sides.forEach(a=>{a.parentElement.style.display=(!v||(a.dataset.q||'').includes(v))?'':'none';});let vc=0;articles.forEach(art=>{const txt=art.innerText.toLowerCase();const match=!v||txt.includes(v);art.style.display=match?'':'none';if(match)vc++;});let e=document.getElementById('empty');if(vc===0&&v){if(!e){e=document.createElement('div');e.id='empty';e.className='filter-empty';e.innerHTML='<div class="ms material-symbols-outlined">search_off</div><div>لا توجد نتائج لـ "'+esc(v)+'"</div>';document.getElementById('endpoints').appendChild(e);}}else if(e)e.remove();};q.addEventListener('input',apply);};
const showStats=(spec)=>{
  const paths=Object.keys(spec.paths||{}).length;
  let ops=0;
  for(const m of Object.values(spec.paths||{}))for(const k of Object.keys(m))if('get,post,put,delete,patch'.includes(k))ops++;
  const sz=APP.yamlText.length||0;
  document.getElementById('statPaths').textContent=paths;
  document.getElementById('statOps').textContent=ops;
  document.getElementById('statSchemas').textContent=Object.keys(spec.components?.schemas||{}).length;
  document.getElementById('statSec').textContent=Object.keys(spec.components?.securitySchemes||{}).length;
  document.getElementById('statSize').textContent=sz>1024?(sz/1024).toFixed(1)+' KB':sz+' B';
};
const exportSpec=()=>{
  if(!APP.spec){alert('لا توجد مواصفات محمّلة · Spec not loaded yet');return;}
  const blob=new Blob([JSON.stringify(APP.spec,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pcc-openapi.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},100);
};
const buildTryItPanel=(pathTpl,method,op)=>{
  const pathParams=(op.parameters||[]).filter(p=>p.in==='path');
  const headerParams=(op.parameters||[]).filter(p=>p.in==='header');
  const hasBody=op.requestBody && op.requestBody.content && op.requestBody.content['application/json'];
  const exampleBody=hasBody?(op.requestBody.content['application/json'].example||{ts:Date.now()}):null;
  const f=p=>{const ex=p.example||(p.schema&&p.schema.example)||'';return`<label>${esc(p.name)} <span class="badge">${p.in}</span></label><input data-try${p.in}="${esc(p.name)}" value="${esc(ex)}" placeholder="${esc(ex||p.name)}" autocomplete="off">`;};
  const fields=pathParams.map(f).join('');
  const hdrs=headerParams.map(f).join('');
  const bodyField=hasBody?`<label>Request body (JSON)</label><textarea data-trybody>${esc(JSON.stringify(exampleBody,null,2))}</textarea>`:'';
  return`<div class="tryit-panel" data-tryit-panel="${esc(pathTpl)}" data-tryit-method="${method}">
    <h4><span class="material-symbols-outlined" style="font-size:14px;">play_circle</span> جرّب الآن · Try it live</h4>
    <div style="font-size:10.5px;color:var(--nm-muted);margin-bottom:4px;font-family:monospace;direction:ltr;text-align:left;">${esc(method)} <span data-tryit-url>${esc(APP.server+pathTpl)}</span></div>
    ${fields}${hdrs}${bodyField}
    <div class="tryit-actions">
      <button class="exec" data-exec="${esc(pathTpl)}" data-method="${method}" type="button"><span class="material-symbols-outlined" style="font-size:13px;">send</span> تنفيذ · Execute</button>
      <button class="cancel" data-cancel="${esc(pathTpl)}" type="button">إلغاء</button>
      <span data-srvlabel style="margin-inline-start:auto;font-size:10.5px;color:var(--nm-muted);">→ ${esc(APP.server)}</span>
    </div>
    <div class="tryit-result" data-result="${esc(pathTpl)}"></div>
  </div>`;
};
const executeTryIt=async(pathTpl,method)=>{
  const panel=document.querySelector(`[data-tryit-panel="${CSS.escape(pathTpl)}"]`);
  if(!panel)return;
  const result=panel.querySelector('[data-result]');
  const execBtn=panel.querySelector('[data-exec]');
  let url=APP.server+pathTpl;
  panel.querySelectorAll('[data-trypath]').forEach(inp=>{
    url=url.replace(new RegExp('\\{'+inp.dataset.trypath+'\\}','g'),encodeURIComponent((inp.value||'').trim()||inp.placeholder||inp.dataset.trypath));
  });
  result.className='tryit-result show pending';
  result.innerHTML='<div class="meta-line"><span>⏳ جاري الإرسال · Sending…</span></div>';
  if(execBtn){execBtn.disabled=true;execBtn.innerHTML='<span class="material-symbols-outlined" style="font-size:13px;">hourglass_empty</span> انتظر…';}
  const t0=performance.now();
  const headers={'Accept':'application/json'};
  panel.querySelectorAll('[data-tryheader]').forEach(inp=>{const v=(inp.value||'').trim();if(v)headers[inp.dataset.tryheader]=v;});
  let body=undefined;
  if(method!=='GET' && method!=='HEAD'){
    const ta=panel.querySelector('[data-trybody]');
    if(ta && ta.value.trim()){
      try{JSON.parse(ta.value);headers['Content-Type']='application/json';body=ta.value;}
      catch(e){
        result.className='tryit-result show err';
        result.innerHTML=`<div class="meta-line"><span>✗ JSON غير صالح · Invalid JSON</span></div><div style="font-size:11px;">${esc(e.message)}</div>`;
        if(execBtn){execBtn.disabled=false;execBtn.innerHTML='<span class="material-symbols-outlined" style="font-size:13px;">send</span> تنفيذ · Execute';}
        return;
      }
    }
  }
  try{
    const r=await fetch(url,{method,headers,body,credentials:'include'});
    const dt=Math.round(performance.now()-t0);
    const text=await r.text();
    let pretty=text;
    const ct=r.headers.get('content-type')||'';
    if(ct.includes('json')){try{pretty=JSON.stringify(JSON.parse(text),null,2);}catch(_){}}
    result.className='tryit-result show '+(r.ok?'ok':'err');
    result.innerHTML=`<div class="meta-line"><span>${r.ok?'✓':'✗'} ${esc(method)} ${esc(url)}</span><span class="timing">${dt} ms</span></div><div class="meta-line"><span><b>Status:</b> ${r.status} ${esc(r.statusText||'')}</span><span><b>Size:</b> ${pretty.length} B</span><span><b>Type:</b> ${esc(ct||'unknown')}</span></div><pre class="body-pre">${esc(pretty)}</pre>`;
  }catch(err){
    const dt=Math.round(performance.now()-t0);
    result.className='tryit-result show err';
    result.innerHTML=`<div class="meta-line"><span>✗ خطأ شبكة · Network error (${dt} ms)</span></div><div style="font-size:11px;">${esc(err.message||String(err))}</div>`;
  }finally{
    if(execBtn){execBtn.disabled=false;execBtn.innerHTML='<span class="material-symbols-outlined" style="font-size:13px;">send</span> تنفيذ · Execute';}
  }
};
const findOp=(spec,path,method)=>{if(!spec||!spec.paths)return null;const p=spec.paths[path];if(!p)return null;return p[method.toLowerCase()]||null;};
const showTryItForOp=(op,pathTpl,method)=>{const host=document.querySelector(`[data-tryit-host="${CSS.escape(pathTpl)}"][data-tryit-method="${method}"]`);if(!host||host.dataset.built)return;host.innerHTML=buildTryItPanel(pathTpl,method,op);host.dataset.built='1';};
document.addEventListener('click',e=>{
  const btn=e.target.closest('.copy-btn');
  if(btn){const txt=btn.dataset.curl||'';navigator.clipboard?.writeText(txt).then(()=>{const o=btn.innerHTML;btn.classList.add('copied');btn.innerHTML='<span class="ms material-symbols-outlined">check</span>تم النسخ';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML=o;},1500);});return;}
  const tab=e.target.closest('.samples-tabs button');
  if(tab){const cont=tab.parentElement;cont.querySelectorAll('button').forEach(b=>b.classList.remove('on'));tab.classList.add('on');const ep=tab.closest('.coll').querySelector('.body');ep.querySelectorAll('pre.code').forEach(p=>p.style.display='none');const target=ep.querySelectorAll('pre.code')[parseInt(tab.dataset.s)];if(target)target.style.display='';return;}
  const tbtn=e.target.closest('.tryit-btn');
  if(tbtn){const op=findOp(APP.spec,tbtn.dataset.tryit,tbtn.dataset.method);if(!op)return;showTryItForOp(op,tbtn.dataset.tryit,tbtn.dataset.method);setTimeout(()=>{const p=document.querySelector(`[data-tryit-panel="${CSS.escape(tbtn.dataset.tryit)}"]`);if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'});},50);return;}
  const ebtn=e.target.closest('[data-exec]');
  if(ebtn){executeTryIt(ebtn.dataset.exec,ebtn.dataset.method);return;}
  const cbtn=e.target.closest('[data-cancel]');
  if(cbtn){const host=document.querySelector(`[data-tryit-host="${CSS.escape(cbtn.dataset.cancel)}"]`);if(host){host.innerHTML='';delete host.dataset.built;}return;}
});
const status=(msg,type='ok')=>{let bar=document.getElementById('status-bar');if(!bar){bar=document.createElement('div');bar.id='status-bar';bar.className='status-bar '+type;document.getElementById('content').prepend(bar);}else{bar.className='status-bar '+type;}bar.innerHTML=msg;};
const loadSpec=async()=>{
  status('⏳ تحميل المواصفات · Loading spec from same-origin YAML…','warn');
  try{
    const r=await fetch('/openapi-pcc.yaml',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const yaml=await r.text();
    const mod=await import('https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs');
    const root=mod.default.load(yaml);
    APP.spec=root; APP.yamlText=yaml;
    status('✓ تم تحميل المواصفات ('+yaml.length+' bytes, '+Object.keys(root.paths||{}).length+' paths) · الخادم: '+esc(APP.server),'ok');
    renderAll();
  }catch(err){
    try{const root=JSON.parse(document.getElementById('fallback-spec').textContent);APP.spec=root;APP.yamlText=JSON.stringify(root);status('⚠ تعذّر YAML ('+esc(err.message)+') — استخدام المضمّنة','err');renderAll();}
    catch(e2){status('✗ فشل التحميل: '+esc(e2.message),'err');}
  }
};
const renderAll=()=>{
  if(!APP.spec)return;
  document.getElementById('intro').innerHTML=renderIntro(APP.spec.info||{});
  document.getElementById('apiVersion').textContent='v'+(APP.spec.info?.version||'—');
  let count=0;
  for(const[,methods]of Object.entries(APP.spec.paths||{})){for(const[m]of Object.entries(methods)){if(['get','post','put','delete','patch'].includes(m))count++;}}
  document.getElementById('apiCount').textContent=count+' endpoints';
  document.getElementById('sidebar').innerHTML=renderSidebar(APP.spec);
  const cont=document.getElementById('endpoints');cont.innerHTML='';
  for(const[p,methods]of Object.entries(APP.spec.paths||{})){for(const[m,op]of Object.entries(methods)){if(!['get','post','put','delete','patch'].includes(m))continue;cont.insertAdjacentHTML('beforeend',renderPath(APP.spec,p,m,op));}}
  setupFilter();showStats(APP.spec);
  document.querySelectorAll('aside a.nav').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();const id=a.getAttribute('href').slice(1);const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id);}});});
};
document.getElementById('serverSel').addEventListener('change',e=>{
  APP.server=e.target.value;
  const intro=document.getElementById('introServer');if(intro)intro.textContent=APP.server;
  status('✓ الخادم: '+esc(APP.server)+' · YAML يُحمَّل من نفس الأصل؛ Try-it يستخدم القاعدة المحددة','ok');
  document.querySelectorAll('.tryit-panel').forEach(p=>{const pathTpl=p.dataset.tryitPanel;const urlEl=p.querySelector('[data-tryit-url]');if(urlEl)urlEl.textContent=APP.server+pathTpl;const srvLabel=p.querySelector('[data-srvlabel]');if(srvLabel)srvLabel.textContent='→ '+APP.server;});
  loadSpec();
});
document.getElementById('exportBtn').addEventListener('click',exportSpec);
loadSpec();
</script>
</body>
</html>
