# Prometheus Alerting Rules — PCC Sandbox v3.316.24
# Loaded by Prometheus (or compatible) via `rule_files:`.
# Metrics source: http://<host>:3100/_metrics  (Prometheus text format v0.0.4)
# Validation:   promtool check rules alerts/pcc-alerts.yaml

groups:
  - name: pcc_sandbox_alerts
    interval: 30s
    rules:
      # ----------------------------------------------------------------
      # 1. HighMemoryUsage — warning at 1.5 GB sustained for 5 minutes
      # ----------------------------------------------------------------
      - alert: HighMemoryUsage
        expr: pcc_memory_rss_bytes > 1610612736
        for: 5m
        labels:
          severity: warning
          service: pcc-sandbox
        annotations:
          summary: "PCC memory usage high ({{ $value | humanize1024 }}B)"
          description: "PCC Sandbox RSS memory has exceeded 1.5 GB for 5 minutes."

      # ----------------------------------------------------------------
      # 2. CriticalMemoryUsage — critical at 3 GB sustained for 2 minutes
      # ----------------------------------------------------------------
      - alert: CriticalMemoryUsage
        expr: pcc_memory_rss_bytes > 3221225472
        for: 2m
        labels:
          severity: critical
          service: pcc-sandbox
        annotations:
          summary: "PCC memory usage critical ({{ $value | humanize1024 }}B)"
          description: "PCC Sandbox RSS memory has exceeded 3 GB. Consider restarting."

      # ----------------------------------------------------------------
      # 3. HighErrorRate — 5xx > 5% of total traffic for 5 minutes
      # ----------------------------------------------------------------
      - alert: HighErrorRate
        expr: sum(rate(pcc_http_requests_total{status=~"5.."}[5m])) / sum(rate(pcc_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: pcc-sandbox
        annotations:
          summary: "PCC 5xx error rate > 5%"
          description: "More than 5% of HTTP responses returned 5xx in the last 5 minutes."

      # ----------------------------------------------------------------
      # 4. HighRateLimitRate — 429 responses > 1 req/s for 5 minutes
      # ----------------------------------------------------------------
      - alert: HighRateLimitRate
        expr: sum(rate(pcc_http_requests_total{status="429"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: pcc-sandbox
        annotations:
          summary: "PCC rate-limit 429s > 1 req/s"
          description: "Rate-limit responses exceeded 1 req/s sustained for 5 minutes."

      # ----------------------------------------------------------------
      # 5. SlowRequests — p95 latency > 1s on any route for 5 minutes
      # ----------------------------------------------------------------
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (route, le) (rate(pcc_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
          service: pcc-sandbox
        annotations:
          summary: "PCC p95 latency > 1s on {{ $labels.route }}"
          description: "95th percentile request latency exceeds 1 second on route {{ $labels.route }}."

      # ----------------------------------------------------------------
      # 6. AuditLogSaturation — > 900/1000 entries sustained for 10 minutes
      # ----------------------------------------------------------------
      - alert: AuditLogSaturation
        expr: pcc_audit_log_entries > 900
        for: 10m
        labels:
          severity: warning
          service: pcc-sandbox
        annotations:
          summary: "PCC audit log near capacity ({{ $value }}/1000)"
          description: "In-memory audit log has exceeded 900 of 1000 entries. Oldest will start being dropped."

      # ----------------------------------------------------------------
      # 7. ProcessDown — scrape target unreachable for 1 minute
      # ----------------------------------------------------------------
      - alert: ProcessDown
        expr: up{job="pcc-sandbox"} == 0
        for: 1m
        labels:
          severity: critical
          service: pcc-sandbox
        annotations:
          summary: "PCC Sandbox is DOWN"
          description: "PCC Sandbox process has been unreachable for 1 minute."

      # ----------------------------------------------------------------
      # 8. LowRequestVolume — < 0.01 req/s for 30m after 10m warmup
      # ----------------------------------------------------------------
      - alert: LowRequestVolume
        expr: sum(rate(pcc_http_requests_total[10m])) < 0.01 and pcc_uptime_seconds > 600
        for: 30m
        labels:
          severity: info
          service: pcc-sandbox
        annotations:
          summary: "PCC request volume abnormally low"
          description: "Less than 0.01 req/s for 30 minutes after warmup. Possible upstream issue or stuck traffic."

      # ----------------------------------------------------------------
      # 9. RestartLoop — uptime decreased within last 10 minutes
      # ----------------------------------------------------------------
      - alert: RestartLoop
        expr: changes(pcc_uptime_seconds[10m]) < 0
        for: 5m
        labels:
          severity: warning
          service: pcc-sandbox
        annotations:
          summary: "PCC process restarted in last 10m"
          description: "PCC Sandbox uptime decreased — process was restarted within the last 10 minutes."
