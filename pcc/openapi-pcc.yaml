openapi: 3.0.3
info:
  title: jumanaMedical PCC Catalog API
  version: 3.316.25
  description: |
    ## نظرة عامة (Arabic Overview)
    واجهة برمجة تطبيقات كتالوج وحدات PCC لنظام جمانة ميديكال ERP.
    تعرض جميع الوحدات السريرية (PCC Modules) والإجراءات القابلة للاستدعاء،
    وتدعم استدعاء أي دالة من أي وحدة مع تمرير الحمولة والحصول على النتيجة والدرجة والوقت.
    - **عدد الوحدات الكلي**: 1322 وحدة PCC
    - **الأنماط**: `/api/v1/pcc-<name>/list`, `/api/v1/pcc-<name>/call/<fn>`, `/api/v1/pcc-<name>/record`
    - **التوثيق المعماري**: `docs/ARCHITECTURE_MAP_AR.md` (المرجع الكنسي)
    - **نطاق الأمان**: Tenant + RBAC + Idempotency

    ## English Overview
    The PCC (Programmable Clinical Component) Catalog API for the jumanaMedical ERP
    exposes all 1322 registered clinical modules and the function set each module offers.
    - **Modules total**: 1322 PCC modules
    - **List pattern**: `GET /api/v1/pcc-<name>/list`
    - **Call pattern**: `POST /api/v1/pcc-<name>/call/<fn>`
    - **Record pattern**: `POST /api/v1/pcc-<name>/record` (requires tenant_id)
  contact:
    name: jumanaMedical API Team
    url: https://jumanasoft.com
    email: api@jumanasoft.example

servers:
  - url: http://localhost:3201/api/v1
    description: Local sandbox (port 3201)
  - url: https://jumanasoft.com/api/v1
    description: Production

tags:
  - name: PCC Catalog
    description: استعراض الكتالوج - Catalog listing
  - name: PCC Module
    description: استدعاء الوحدات - Module operations

paths:
  /healthz:
    get:
      summary: K8s liveness probe (plain text)
      responses:
        '200':
          description: Always returns "ok" while process is alive
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /livez:
    get:
      summary: K8s process liveness
      responses:
        '200':
          description: Always returns "alive" while process is alive
          content:
            text/plain:
              schema:
                type: string
                example: alive
  /readyz:
    get:
      summary: K8s readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  checks:
                    type: object
                    properties:
                      uptime_seconds: { type: integer }
                      memory_mb: { type: integer }
                      audit_log_size: { type: integer }
                      build: { type: string }
        '503':
          description: Not ready (memory pressure or short uptime)
  /_metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200':
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP pcc_uptime_seconds Process uptime in seconds
                  # TYPE pcc_uptime_seconds gauge
                  pcc_uptime_seconds 3600
  /graphql/query:
    post:
      summary: Execute a GraphQL query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: "{ stats { totalModules } }" }
                variables: { type: object }
                operationName: { type: string }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message: { type: string }
    get:
      summary: Browser-friendly GraphQL fallback
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Same as POST
          content:
            application/json:
              schema:
                type: object
  /pcc-catalog/modules:
    get:
      tags:
        - PCC Catalog
      operationId: listPccModules
      summary: قائمة جميع وحدات PCC الـ1322 - List all PCC modules
      description: |
        تُرجع فهرس جميع الوحدات الـ PCC المسجلة مع رقم الإصدار والعدد الكلي.
      responses:
        '200':
          description: Catalog fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PCCCatalog"
        '401':
          $ref: "#/components/responses/Unauthorized"

  /pcc-catalog/{module}/list:
    get:
      tags:
        - PCC Module
      operationId: listPccModuleFunctions
      summary: استعراض دوال وحدة PCC محددة
      description: تُرجع اسم الوحدة وإصدارها وقائمة الدوال القابلة للاستدعاء.
      parameters:
        - $ref: "#/components/parameters/ModuleName"
      responses:
        '200':
          description: Module manifest fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PCCModule"
        '404':
          $ref: "#/components/responses/NotFound"

  /pcc-catalog/{module}/call/{fn}:
    post:
      tags:
        - PCC Module
      operationId: callPccModuleFunction
      summary: استدعاء دالة داخل وحدة PCC
      parameters:
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/FunctionName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PCCFunctionCallRequest"
      responses:
        '200':
          description: Function executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PCCFunctionCall"
        '404':
          $ref: "#/components/responses/NotFound"

  /pcc-catalog/{module}/record:
    post:
      tags:
        - PCC Module
      operationId: recordPccModuleFunction
      summary: تسجيل نتيجة PCC في audit trail - Record a PCC result with tenant context
      description: |
        يستدعي دالة PCC مع tenant_id إلزامي ويُسجّل النتيجة في audit log.
        Requires either `tenant_id` or `decisionId` in the request body.
      parameters:
        - $ref: "#/components/parameters/ModuleName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PCCRecordRequest"
      responses:
        '200':
          description: Result recorded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PCCRecordResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"

  # v3.316.25: API-token issuance, public status page, RSS feed
  /api/v1/pcc-catalog/api-token:
    post:
      tags:
        - PCC Catalog
      operationId: issuePccCatalogApiToken
      summary: Issue a new bearer token (30-day TTL)
      description: |
        Issues a 30-day bearer token for read access to the catalog API
        and GraphQL endpoint. Returns the plaintext token exactly once —
        callers must store it securely.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 64
                  default: default
                  example: my-ci-runner
      responses:
        '200':
          description: Token issued (returns the token once — store securely)
          content:
            application/json:
              schema:
                type: object
                required: [token, token_prefix, label, issued_at, expires_at, usage, storage]
                properties:
                  token: { type: string, example: "a3f9..." }
                  token_prefix: { type: string, example: "a3f9b8c2..." }
                  label: { type: string, example: "my-ci-runner" }
                  issued_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  usage: { type: string, example: "Authorization: Bearer a3f9..." }
                  storage: { type: string, enum: [pg], example: pg }
        '500':
          description: Token issuance failed (PG unreachable)
    get:
      tags:
        - PCC Catalog
      operationId: listPccCatalogApiTokens
      summary: List issued tokens (metadata only)
      description: |
        Lists metadata for all tokens ever issued. Plaintext tokens are
        never returned (only prefixes). Useful for ops/CI visibility.
      responses:
        '200':
          description: List of issued tokens with their lifecycle state
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        token_prefix: { type: string }
                        label: { type: string }
                        issued_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        revoked: { type: boolean }
                        expired: { type: boolean }
        '500':
          description: List query failed
  /api/v1/pcc-catalog/api-token/revoke:
    post:
      tags:
        - PCC Catalog
      operationId: revokePccCatalogApiToken
      summary: Revoke an issued token (immediate effect)
      description: |
        Marks the supplied token as revoked. Effective immediately —
        subsequent requests bearing the token will return 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The full token string to revoke
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                  token_prefix: { type: string }
        '400':
          description: token field missing
        '500':
          description: Revocation failed
  /status/:
    get:
      tags:
        - Status
      operationId: getStatusPage
      summary: Public status page (HTML)
      description: |
        Human-readable status page. Static HTML generated from the most
        recent status snapshot.
      responses:
        '200':
          description: Human-readable status page
          content:
            text/html:
              schema: { type: string }
  /status/status.json:
    get:
      tags:
        - Status
      operationId: getStatusJson
      summary: Status snapshot (JSON)
      description: |
        Machine-readable status snapshot suitable for dashboards and
        uptime monitors.
      responses:
        '200':
          description: Machine-readable status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  version: { type: string }
                  status: { type: string, enum: [operational, degraded, down] }
                  last_checked_at: { type: string, format: date-time }
                  uptime_seconds: { type: integer }
                  checks: { type: object }
                  endpoints: { type: object }
                  incidents:
                    type: array
                    items: { type: object }
  /status/index.xml:
    get:
      tags:
        - Status
      operationId: getStatusRss
      summary: Status RSS feed (for monitoring tools)
      description: |
        RSS 2.0 feed of status changes. Useful for RSS-aware monitors
        and incident subscription.
      responses:
        '200':
          description: RSS 2.0 feed of status changes
          content:
            application/rss+xml:
              schema: { type: string }

# v3.316.22: pcc_rate_limit_log (PostgreSQL, env-gated persistence)
#   INSERT triggered automatically when PCC_AUDIT_PERSIST=true AND a 429
#   is returned by either pccRateLimit (IP-based) or pccTenantRateLimit.
#   Schema: id, ip, endpoint, bucket_start, count, blocked, created_at.
#   Tenant-based 429s are recorded with ip = 'tenant:<tenant_id>' so they
#   can be distinguished from per-IP 429s in the same table.
#   See migrations/pcc_catalog_v3.316.16_up.sql for the table DDL and
#   pcc/audit_store.js (recordRateLimitEvent) for the write path.
#   This is purely observational logging — no public GET endpoint is
#   exposed in this spec; ops access it directly via psql.

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
    TenantHeader:
      type: apiKey
      in: header
      name: x-tenant-id

  parameters:
    ModuleName:
      name: module
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]+$"
      example: pcc-cardiology-ext102
    FunctionName:
      name: fn
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]+$"
      example: CardGenExt
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: مفتاح التكرار للسلامة في المسارات النقدية

  schemas:
    PCCCatalog:
      type: object
      properties:
        version:
          type: string
        count:
          type: integer
        modules:
          type: array
          items:
            type: string
      required: [version, count, modules]
    PCCModule:
      type: object
      properties:
        module:
          type: string
        version:
          type: string
        functions:
          type: array
          items:
            type: string
      required: [module, version, functions]
    PCCFunctionCallRequest:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
        decisionId:
          type: string
    PCCFunctionCall:
      type: object
      properties:
        module:
          type: string
        function:
          type: string
        input:
          type: object
        score:
          type: number
        ts:
          type: string
          format: date-time
      required: [module, function, score, ts]
    PCCRecordRequest:
      type: object
      properties:
        tenant_id:
          type: string
        decisionId:
          type: string
        fn:
          type: string
        input:
          type: object
          additionalProperties: true
        created_by:
          type: string
      required: [fn]
    PCCRecordResponse:
      type: object
      properties:
        version:
          type: string
        module:
          type: string
        function:
          type: string
        tenant_id:
          type: string
        decisionId:
          type: string
        result:
          type: object
        recorded:
          type: boolean
        created_by:
          type: string
        ts:
          type: string
          format: date-time
      required: [module, function, recorded, ts]
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required: [error]

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Tenant context missing or access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Module or function not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Missing required fields (tenant_id, fn, etc.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

