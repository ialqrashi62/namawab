openapi: 3.1.0
info: { title: Fetal Surgery API, version: 1.0.0 }
paths:
    /fetal_surgery/fetal_surgery_main:
      post:
        summary: fetal_surgery_main
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /fetal_surgery/fetal_surgery_list:
      post:
        summary: fetal_surgery_list
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
