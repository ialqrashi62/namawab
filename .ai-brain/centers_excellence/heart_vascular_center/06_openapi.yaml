openapi: 3.1.0
info: { title: Heart & Vascular Center API, version: 1.0.0 }
paths:
    /heart_vascular_center/heart_vascular_cente_main:
      post:
        summary: heart_vascular_cente_main
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /heart_vascular_center/heart_vascular_cente_list:
      post:
        summary: heart_vascular_cente_list
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
