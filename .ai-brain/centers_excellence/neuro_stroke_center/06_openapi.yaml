openapi: 3.1.0
info: { title: Neuroscience & Stroke Center API, version: 1.0.0 }
paths:
    /neuro_stroke_center/neuro_stroke_center_main:
      post:
        summary: neuro_stroke_center_main
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /neuro_stroke_center/neuro_stroke_center_list:
      post:
        summary: neuro_stroke_center_list
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
