openapi: 3.1.0
info: { title: Level I Trauma Center API, version: 1.0.0 }
paths:
    /trauma_center_l1/trauma_center_l1_main:
      post:
        summary: trauma_center_l1_main
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /trauma_center_l1/trauma_center_l1_list:
      post:
        summary: trauma_center_l1_list
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
