openapi: 3.1.0
info: { title: Comprehensive Cancer Center API, version: 1.0.0 }
paths:
    /cancer_center/cancer_center_main:
      post:
        summary: cancer_center_main
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /cancer_center/cancer_center_list:
      post:
        summary: cancer_center_list
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
