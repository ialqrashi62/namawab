openapi: 3.1.0
info: { title: Behavioral Health Center API, version: 1.0.0 }
paths:
    /behavioral_health_center/behavioral_health_ce_main:
      post:
        summary: behavioral_health_ce_main
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /behavioral_health_center/behavioral_health_ce_list:
      post:
        summary: behavioral_health_ce_list
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
