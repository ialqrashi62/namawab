# PROMPT_REGISTRY.yaml — Central Catalog

> **Path:** `.ai-brain/02-prompt-engineering/PROMPT_REGISTRY.yaml`
> **Authority:** single source of truth for ALL clinical/operational prompts.
> **Lifecycle:** draft → review → production → deprecated

---

## 1. Schema (full)

```yaml
prompts: List<PromptEntry>
guardrails: List<GuardrailEntry>
few_shot_examples: List<Example>
citation_bundles: List<Bundle>
```

---

## 2. PromptEntry full schema

```yaml
PromptEntry:
  required:
    - id: string        # PROMPT:<DEPT>:<encounter_or_feature>
    - version: semver   # 1.4.0
    - status: enum[draft, review, production, deprecated]
    - owner: enum[CMO, AIE, CQO, DSL, SA, PM]
    - dept: string      # CARD-001
    - languages: List<string>  # ar, en
    - tier: enum[1,2,3,4]
    - safety_class: enum[critical, high, standard]
    - requires_red_flag_check: bool
    - requires_drug_check: bool
    - requires_citation: bool
    - input_schema_ref: string
    - output_schema_ref: string
    - guardrail_set_id: string
    - max_tokens: int
    - temperature: float
    - model_target: enum[gpt-4o, claude-3.5, med-llama, multilingual-e5, local]
    - eval_id: string
    - citations_required: int  # min citations per claim
  optional:
    - fallback_chain: string
    - few_shot_count: int
    - locale: enum[ar-SA, en-US, both]
    - cost_per_call_usd: float
    - last_reviewed: ISO-8601
    - next_review: ISO-8601
    - aliases: List<string>
    - notes: string
```

