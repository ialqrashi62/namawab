## 4. Guardrails Registry (subset)

```yaml
guardrails:
  - id: GRD:PRE:phi_redact
    module: src/guardrails/phi_redactor.js
    when: every_request
    fail_action: hard_fail
  - id: GRD:PRE:tenant_check
    module: src/tenant/require_tenant_context.js
    when: every_request
    fail_action: 403
  - id: GRD:PRE:specialty_scope
    module: src/rbac/specialty_scoper.js
    when: every_request
    fail_action: 403
  - id: GRD:POST:red_flag
    module: src/guardrails/red_flag_parser.js
    override_allowed: false
    when: every_response
    on_breach: hard_fail_with_retry_prompt
  - id: GRD:POST:drug_interaction
    module: src/guardrails/drug_interaction_checker.js
    when: every_response_with_drugs
    fail_action: block_drug
  - id: GRD:POST:citation_required
    module: src/guardrails/citation_validator.js
    when: every_clinical_response
    min_citations: 2
    fail_action: refuse_response
  - id: GRD:POST:confidence_threshold
    module: src/guardrails/confidence_scanner.js
    when: every_response
    min_confidence: 0.7
    fail_action: emit_uncertain
  - id: GRD:POST:pii_audit
    module: src/guardrails/pii_auditor.js
    when: every_response
    on_breach: log_and_strip
  - id: GRD:POST:sfda_check
    module: src/guardrails/sfda_drug_validator.js
    when: every_drug_response
    authority: SFDA_Drug_DB_SAUDI
    fail_action: block_drug_if_not_sfda_registered
```

