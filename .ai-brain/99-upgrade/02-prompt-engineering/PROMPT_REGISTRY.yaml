## 6. Eval Framework

```yaml
eval_datasets:
  - id: DATASET:CARD-001:synthetic_eval_v3
    cases: 250
    sources: [
      {n: 100, source: 'CBAHI red flag scenarios'},
      {n: 50,  source: 'ESC guidelines'},
      {n: 50,  source: 'Mass General Brigham case bank'},
      {n: 50,  source: 'Local KSA case bank (deidentified)'}
    ]
    metrics:
      - clinical_accuracy
      - citation_coverage
      - red_flag_recall
      - drug_check_recall
      - hallucination_rate
      - cost_per_call
      - latency_p95
    target_thresholds:
      clinical_accuracy: 0.95
      red_flag_recall: 1.0
      drug_check_recall: 1.0
```

---

## 7. Conventions

- **ID format**: `PROMPT:<DEPT-ID>:<feature>`
- **Version**: semver; bump on any change
- **Status**: `draft` → `review` → `production` → `deprecated`
- **Owner**: the role responsible; co-sign required for `production`
- **Re-eval**: every prompt must re-pass eval suite every 90 days
- **Audit**: every prompt use is logged with patient_id (encrypted), provider_id, time, token used, model

---

## 8. Deployment

- File: `.ai-brain/02-prompt-engineering/PROMPT_REGISTRY.yaml`
- Loaded by: `src/ai/prompt_loader.js` (compile-time + runtime)
- CI gate: every PR adding/changing a prompt must update this file
- Auto-eval: `npm run prompt:eval -- --id=<prompt_id>`

