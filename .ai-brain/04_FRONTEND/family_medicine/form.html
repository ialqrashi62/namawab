<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="family_medicine.form">زيارة جديدة · طب الأسرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/nama-tokens.css">
<style>
  :root { --md-ref-typeface-brand: 'Cairo','Roboto',sans-serif; --md-sys-color-primary: #006B5F; }
  html[lang="en"], html[lang="fr"] { --md-ref-typeface-brand: 'Roboto','Cairo',sans-serif; }
  body { font-family: var(--md-ref-typeface-brand); margin: 0; background: #FAFDFB; color: #191C1B; }
  .md-app-bar { display: flex; align-items: center; padding: 0 24px; gap: 16px; background: white;
                border-bottom: 1px solid rgba(0,0,0,.06); height: 64px; }
  .md-content { padding: 24px; max-width: 800px; margin: 0 auto; }
  .md-card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 16px;
             box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .md-card-title { margin: 0 0 16px; font-size: 18px; font-weight: 600; color: #006B5F; }
  .md-field { margin-bottom: 12px; }
  .md-field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .md-field input, .md-field select, .md-field textarea {
      width: 100%; padding: 12px 14px; border: 1px solid #6F7978;
      border-radius: 4px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
  .md-field input:focus { outline: 2px solid #006B5F; outline-offset: -1px; }
  .md-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .md-btn { padding: 12px 24px; border-radius: 999px; border: 0; cursor: pointer;
            font-weight: 500; background: #006B5F; color: white; font-size: 15px; }
  .md-result { padding: 16px; border-radius: 12px; margin-top: 16px; }
  .md-result.ok { background: #DCFCE7; color: #14532D; }
  .md-result.warn { background: #FEF3C7; color: #78350F; }
  .md-result.err { background: #FECACA; color: #7F1D1D; }
  .md-lang-toggle { margin-inline-start: auto; display: flex; gap: 4px; }
  .md-lang-toggle button { background: transparent; border: 1px solid #6F7978;
                           border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .md-lang-toggle button.active { background: #006B5F; color: white; border-color: #006B5F; }
</style>
</head>
<body>
<header class="md-app-bar">
  <a href="queue.html" style="font-size:24px;text-decoration:none">🏠</a>
  <h1 data-i18n="family_medicine.form" style="font-size:18px;margin:0">زيارة جديدة</h1>
  <div class="md-lang-toggle">
    <button id="btn-ar" class="active" onclick="setLang('ar')">عربي</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</header>
<main class="md-content">
  <div class="md-card">
    <h2 class="md-card-title" data-i18n="family_medicine.visit_form">بيانات الزيارة</h2>
    <form onsubmit="return submitVisit(event)">
      <div class="md-row-2">
        <div class="md-field"><label data-i18n="form.patient_id">رقم المريض</label>
          <input name="patient_id" type="number" required></div>
        <div class="md-field"><label data-i18n="form.visit_date">تاريخ الزيارة</label>
          <input name="visit_date" type="date" required></div>
      </div>
      <div class="md-field"><label data-i18n="form.chief_complaint">الشكوى الرئيسية</label>
        <textarea name="chief_complaint" rows="3" required></textarea></div>
      <div class="md-row-2">
        <div class="md-field"><label data-i18n="form.bp">ضغط الدم (mmHg)</label>
          <input name="sbp" type="number"></div>
        <div class="md-field"><label data-i18n="form.hr">معدل النبض</label>
          <input name="hr" type="number"></div>
      </div>
      <div class="md-row-2">
        <div class="md-field"><label data-i18n="form.weight">الوزن (kg)</label>
          <input name="weight" type="number" step="0.1"></div>
        <div class="md-field"><label data-i18n="form.height">الطول (cm)</label>
          <input name="height" type="number" step="0.1"></div>
      </div>
      <div class="md-field"><label data-i18n="form.diagnosis">التشخيص</label>
        <input name="diagnosis" type="text"></div>
      <div class="md-field"><label data-i18n="form.notes">ملاحظات</label>
        <textarea name="notes" rows="3"></textarea></div>
      <button class="md-btn" type="submit" data-i18n="form.submit">حفظ الزيارة</button>
    </form>
    <div id="result"></div>
  </div>
</main>
<script src="/js/nama-i18n.js"></script>
<script src="/js/nama-api.js"></script>
<script>
async function setLang(lang) {
    localStorage.setItem('nama_lang', lang);
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
    document.querySelectorAll('.md-lang-toggle button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
    await namaI18n.loadLocale(lang);
    namaI18n.applyTranslations();
}
document.addEventListener('DOMContentLoaded', async () => {
    const lang = localStorage.getItem('nama_lang') || 'ar';
    await setLang(lang);
    const id = new URLSearchParams(location.search).get('id');
    if (id) document.querySelector('input[name="patient_id"]').value = id;
});
async function submitVisit(e) {
    e.preventDefault();
    const form = e.target;
    const data = Object.fromEntries(new FormData(form));
    data.sbp = +data.sbp || null;
    data.hr = +data.hr || null;
    data.weight = +data.weight || null;
    data.height = +data.height || null;
    data.patient_id = +data.patient_id;
    try {
        const r = await namaApi.post('/api/family_medicine/visits', data);
        const div = document.getElementById('result');
        div.className = 'md-result ok';
        div.innerHTML = `<strong>✓ تم حفظ الزيارة رقم ${r.id}</strong><br>التاريخ: ${r.visit_date}<br>التشخيص: ${r.diagnosis || '—'}`;
        form.reset();
    } catch (err) {
        const div = document.getElementById('result');
        div.className = 'md-result err';
        div.innerHTML = `<strong>✗ فشل الحفظ</strong><br>${err.message || 'خطأ غير معروف'}`;
    }
    return false;
}
</script>
</body>
</html>
