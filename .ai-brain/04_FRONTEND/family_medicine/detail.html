<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="family_medicine.detail">تفاصيل المريض · طب الأسرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/nama-tokens.css">
<style>
  :root { --md-ref-typeface-brand: 'Cairo','Roboto',sans-serif; --md-sys-color-primary: #006B5F; }
  html[lang="en"], html[lang="fr"] { --md-ref-typeface-brand: 'Roboto','Cairo',sans-serif; }
  body { font-family: var(--md-ref-typeface-brand); margin: 0; background: #FAFDFB; color: #191C1B; }
  .md-app-bar { display: flex; align-items: center; padding: 0 24px; gap: 16px; background: white;
                border-bottom: 1px solid rgba(0,0,0,.06); height: 64px; }
  .md-content { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .md-card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 16px;
             box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .md-card-title { margin: 0 0 16px; font-size: 18px; font-weight: 600; color: #006B5F; }
  .md-row { display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,.04); }
  .md-row:last-child { border-bottom: 0; }
  .md-row span:first-child { color: #6F7978; font-size: 14px; }
  .md-row span:last-child { font-weight: 600; }
  .md-btn { padding: 10px 24px; border-radius: 999px; border: 0; cursor: pointer;
            font-weight: 500; background: #006B5F; color: white; margin-inline-end: 8px; }
  .md-lang-toggle { margin-inline-start: auto; display: flex; gap: 4px; }
  .md-lang-toggle button { background: transparent; border: 1px solid #6F7978;
                           border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .md-lang-toggle button.active { background: #006B5F; color: white; border-color: #006B5F; }
</style>
</head>
<body>
<header class="md-app-bar">
  <a href="queue.html" style="font-size:24px;text-decoration:none">🏠</a>
  <h1 data-i18n="family_medicine.detail" style="font-size:18px;margin:0">تفاصيل المريض</h1>
  <div class="md-lang-toggle">
    <button id="btn-ar" class="active" onclick="setLang('ar')">عربي</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</header>
<main class="md-content">
  <div class="md-card">
    <h2 class="md-card-title" data-i18n="family_medicine.demographics">البيانات الديموغرافية</h2>
    <div class="md-row"><span>MRN</span><span id="mrn">—</span></div>
    <div class="md-row"><span data-i18n="queue.name">الاسم</span><span id="name">—</span></div>
    <div class="md-row"><span data-i18n="queue.age">العمر</span><span id="age">—</span></div>
    <div class="md-row"><span data-i18n="queue.cc">الشكوى الرئيسية</span><span id="cc">—</span></div>
  </div>
  <div class="md-card">
    <h2 class="md-card-title" data-i18n="family_medicine.history">التاريخ الطبي</h2>
    <div id="history">—</div>
  </div>
  <div class="md-card">
    <h2 class="md-card-title" data-i18n="family_medicine.preventive">الفحوصات الوقائية المطلوبة</h2>
    <div id="preventive">—</div>
  </div>
  <div>
    <button class="md-btn" onclick="window.location='form.html?id=' + new URLSearchParams(location.search).get('id')" data-i18n="family_medicine.new_visit">زيارة جديدة</button>
    <button class="md-btn" style="background:transparent;color:#006B5F;border:1px solid #006B5F" onclick="window.location='queue.html'" data-i18n="family_medicine.back">عودة</button>
  </div>
</main>
<script src="/js/nama-i18n.js"></script>
<script src="/js/nama-api.js"></script>
<script>
async function setLang(lang) {
    localStorage.setItem('nama_lang', lang);
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
    document.querySelectorAll('.md-lang-toggle button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
    await namaI18n.loadLocale(lang);
    namaI18n.applyTranslations();
}
document.addEventListener('DOMContentLoaded', async () => {
    const lang = localStorage.getItem('nama_lang') || 'ar';
    await setLang(lang);
    const id = new URLSearchParams(location.search).get('id');
    if (id) loadPatient(id);
});
async function loadPatient(id) {
    try {
        const p = await namaApi.get('/api/family_medicine/patients/' + id);
        document.getElementById('mrn').textContent = p.mrn || '—';
        document.getElementById('name').textContent = p.name_ar || p.name || '—';
        document.getElementById('age').textContent = p.age || '—';
        document.getElementById('cc').textContent = p.chief_complaint || '—';
        document.getElementById('history').textContent = (p.medical_history || []).join('، ') || 'لا يوجد';
        document.getElementById('preventive').innerHTML = (p.preventive_recommendations || []).map(r => `<div>• ${r}</div>`).join('') || 'لا توجد توصيات';
    } catch (e) { console.error('Detail load failed', e); }
}
</script>
</body>
</html>
