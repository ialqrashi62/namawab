<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="family_medicine.queue">قائمة المرضى · طب الأسرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/nama-tokens.css">
<style>
  :root { --md-ref-typeface-brand: 'Cairo','Roboto',sans-serif; --md-sys-color-primary: #006B5F; }
  html[lang="en"], html[lang="fr"] { --md-ref-typeface-brand: 'Roboto','Cairo',sans-serif; }
  body { font-family: var(--md-ref-typeface-brand); margin: 0; background: #FAFDFB; color: #191C1B; }
  .md-app-bar { display: flex; align-items: center; padding: 0 24px; gap: 16px; background: white;
                border-bottom: 1px solid rgba(0,0,0,.06); height: 64px; }
  .md-content { padding: 24px; max-width: 1200px; margin: 0 auto; }
  table.queue { width: 100%; border-collapse: collapse; background: white;
                border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  table.queue th { background: rgba(0,107,95,0.08); padding: 12px 16px; text-align: start;
                   font-size: 13px; font-weight: 600; color: #006B5F; text-transform: uppercase; letter-spacing: 0.5px; }
  table.queue td { padding: 12px 16px; border-top: 1px solid rgba(0,0,0,.04); font-size: 14px; }
  table.queue tr:hover { background: rgba(0,107,95,0.02); }
  .md-btn { padding: 8px 16px; border-radius: 999px; border: 0; cursor: pointer;
            font-weight: 500; background: #006B5F; color: white; }
  .md-btn:hover { box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .md-lang-toggle { margin-inline-start: auto; display: flex; gap: 4px; }
  .md-lang-toggle button { background: transparent; border: 1px solid #6F7978;
                           border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .md-lang-toggle button.active { background: #006B5F; color: white; border-color: #006B5F; }
</style>
</head>
<body>
<header class="md-app-bar">
  <a href="index.html" style="font-size:24px;text-decoration:none">🏠</a>
  <h1 data-i18n="family_medicine.queue" style="font-size:18px;margin:0">قائمة المرضى</h1>
  <div class="md-lang-toggle">
    <button id="btn-ar" class="active" onclick="setLang('ar')">عربي</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</header>
<main class="md-content">
  <table class="queue">
    <thead>
      <tr><th>MRN</th><th data-i18n="queue.name">الاسم</th><th data-i18n="queue.age">العمر</th>
          <th data-i18n="queue.cc">الشكوى</th><th data-i18n="queue.status">الحالة</th>
          <th data-i18n="queue.action">إجراء</th></tr>
    </thead>
    <tbody id="queue-body"></tbody>
  </table>
</main>
<script src="/js/nama-i18n.js"></script>
<script src="/js/nama-api.js"></script>
<script>
async function setLang(lang) {
    localStorage.setItem('nama_lang', lang);
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
    document.querySelectorAll('.md-lang-toggle button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');
    await namaI18n.loadLocale(lang);
    namaI18n.applyTranslations();
}
document.addEventListener('DOMContentLoaded', async () => {
    const lang = localStorage.getItem('nama_lang') || 'ar';
    await setLang(lang);
    loadQueue();
});
async function loadQueue() {
    try {
        const data = await namaApi.get('/api/family_medicine/patients');
        const tbody = document.getElementById('queue-body');
        tbody.innerHTML = (data.patients || []).map(p => `
            <tr>
                <td>${p.mrn || '—'}</td>
                <td>${p.name_ar || p.name || '—'}</td>
                <td>${p.age || '—'}</td>
                <td>${p.chief_complaint || '—'}</td>
                <td><span style="padding:4px 10px;border-radius:999px;font-size:12px;background:rgba(0,107,95,.1);color:#006B5F">${p.status || '—'}</span></td>
                <td><button class="md-btn" onclick="window.location='detail.html?id=' + ${p.id}">عرض</button></td>
            </tr>
        `).join('');
    } catch (e) {
        console.error('Queue load failed', e);
    }
}
</script>
</body>
</html>
