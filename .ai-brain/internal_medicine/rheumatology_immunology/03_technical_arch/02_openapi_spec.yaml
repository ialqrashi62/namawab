openapi: 3.1.0
info: { title: Rheumatology & Immunology API, version: 1.0.0 }
paths:
    /rheumatology_immunology/das28_score:
      post:
        summary: das28_score
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /rheumatology_immunology/biologic_eligibility:
      post:
        summary: biologic_eligibility
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /rheumatology_immunology/autoimmune_panel:
      post:
        summary: autoimmune_panel
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /rheumatology_immunology/allergy_test:
      post:
        summary: allergy_test
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /rheumatology_immunology/steroid_taper:
      post:
        summary: steroid_taper
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
