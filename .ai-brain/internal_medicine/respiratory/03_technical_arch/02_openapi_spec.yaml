openapi: 3.1.0
info: { title: Pulmonology & Respiratory API, version: 1.0.0 }
paths:
    /respiratory/spirometry_interpret:
      post:
        summary: spirometry_interpret
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /respiratory/inhaler_optimize:
      post:
        summary: inhaler_optimize
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /respiratory/sleep_study_order:
      post:
        summary: sleep_study_order
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /respiratory/oxygen_titrate:
      post:
        summary: oxygen_titrate
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /respiratory/exacerbation_plan:
      post:
        summary: exacerbation_plan
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
