openapi: 3.1.0
info: { title: Cardiology & Vascular API, version: 1.0.0 }
paths:
    /cardiology/risk_stratify:
      post:
        summary: risk_stratify
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /cardiology/ecg_interpret:
      post:
        summary: ecg_interpret
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /cardiology/echo_order:
      post:
        summary: echo_order
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /cardiology/med_titrate:
      post:
        summary: med_titrate
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
    /cardiology/followup_plan:
      post:
        summary: followup_plan
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payload'}
        responses:
          '200': {description: OK}
          '400': {description: Validation}
components:
  schemas:
    Payload:
      type: object
      required: [tenant_id]
      properties:
        tenant_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
