<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bed Detail — تفاصيل السرير</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-900 text-white min-h-screen" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="/cc" class="text-slate-400 hover:text-white">← العودة</a>
      <h1 class="text-xl font-bold">Bed Detail — تفاصيل السرير</h1>
    </div>
  </header>

  <main class="p-6">
    <section class="bg-slate-800 rounded-xl p-6 mb-4">
      <h2 class="text-2xl font-bold mb-4">Bed: ICU-01</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <p class="text-xs text-slate-400">Type</p>
          <p class="font-bold text-lg">ICU</p>
        </div>
        <div>
          <p class="text-xs text-slate-400">Status</p>
          <p class="font-bold text-lg text-red-400">Occupied</p>
        </div>
        <div>
          <p class="text-xs text-slate-400">Patient</p>
          <p class="font-bold text-lg">--</p>
        </div>
        <div>
          <p class="text-xs text-slate-400">Expected Discharge</p>
          <p class="font-bold text-lg">2026-08-18</p>
        </div>
      </div>
    </section>

    <section class="bg-slate-800 rounded-xl p-6 mb-4">
      <h3 class="font-bold mb-4">Equipment Attached</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-700 p-3 rounded-lg">
          <p class="font-medium">Ventilator V-1234</p>
          <p class="text-xs text-emerald-400">● Active</p>
        </div>
        <div class="bg-slate-700 p-3 rounded-lg">
          <p class="font-medium">Monitor M-5678</p>
          <p class="text-xs text-emerald-400">● Active</p>
        </div>
      </div>
    </section>

    <section class="flex gap-3">
      <button class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-lg font-bold">Mark Ready for Cleaning</button>
      <button class="bg-amber-600 hover:bg-amber-700 px-6 py-3 rounded-lg font-bold">Transfer Patient</button>
      <button class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg font-bold">Discharge</button>
    </section>
  </main>
</body>
</html>
