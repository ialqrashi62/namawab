<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCI Activation — تفعيل MCI</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-900 text-white min-h-screen" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-red-900 border-b border-red-700 px-6 py-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <h1 class="text-xl font-bold">🚨 MCI Activation — تفعيل MCI</h1>
    </div>
  </header>

  <main class="p-6 max-w-3xl">
    <form id="mci-form" class="bg-slate-800 rounded-xl p-6">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">Event Type</label>
          <select name="type" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg" required>
            <option value="accident">Road Accident</option>
            <option value="mass_casualty">Mass Casualty</option>
            <option value="industrial">Industrial Accident</option>
            <option value="fire">Fire</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-2">Estimated Victims</label>
            <input type="number" name="victims" required class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Severity</label>
            <select name="severity" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg">
              <option value="minor">Minor</option>
              <option value="moderate">Moderate</option>
              <option value="severe">Severe</option>
              <option value="critical">Critical</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Surge Capacity Available</label>
          <input type="number" name="surge_capacity" value="50" required class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Notes</label>
          <textarea name="notes" rows="3" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg"></textarea>
        </div>
      </div>
      <button type="submit" class="w-full mt-6 bg-red-600 hover:bg-red-700 text-white py-4 rounded-lg font-bold text-lg">
        🚨 ACTIVATE MCI PROTOCOL
      </button>
    </form>
  </main>

  <script>
    document.getElementById('mci-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      const r = await fetch('/api/cc/mci/activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(data),
      });
      const j = await r.json();
      alert(`MCI Level: ${j.result.mci_level}\nActivated: ${j.result.mci_activated}\nSurge Needed: ${j.result.surge_needed}\n\nActions:\n${j.result.actions.join('\n')}`);
    });
  </script>
</body>
</html>
