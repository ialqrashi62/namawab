<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حجز موعد — Book Appointment</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50 min-h-screen" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-sky-600 text-white px-4 py-3 flex items-center gap-3 sticky top-0 z-50">
    <a href="/pp" class="p-2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="text-lg font-bold">حجز موعد جديد</h1>
  </header>

  <main class="px-4 py-4 pb-20">
    <form id="booking-form" class="space-y-4">
      <!-- Specialty Select -->
      <section class="bg-white rounded-2xl shadow p-4">
        <h3 class="font-bold mb-3">التخصص الطبي</h3>
        <div class="grid grid-cols-2 gap-2">
          <label class="border-2 border-sky-500 bg-sky-50 rounded-xl p-3 text-center cursor-pointer">
            <input type="radio" name="specialty" value="cardiology" checked class="hidden">
            <span class="text-2xl block">❤️</span>
            <span class="text-sm font-medium mt-1 block">أمراض القلب</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="specialty" value="dermatology" class="hidden">
            <span class="text-2xl block">🩺</span>
            <span class="text-sm font-medium mt-1 block">الجلدية</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="specialty" value="orthopedics" class="hidden">
            <span class="text-2xl block">🦴</span>
            <span class="text-sm font-medium mt-1 block">العظام</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="specialty" value="internal" class="hidden">
            <span class="text-2xl block">🩻</span>
            <span class="text-sm font-medium mt-1 block">باطنية</span>
          </label>
        </div>
      </section>

      <!-- Date Picker -->
      <section class="bg-white rounded-2xl shadow p-4">
        <h3 class="font-bold mb-3">اختر التاريخ</h3>
        <input type="date" name="appointment_date" required class="w-full px-3 py-3 border-2 border-slate-200 rounded-xl focus:border-sky-500">
      </section>

      <!-- Time Slots -->
      <section class="bg-white rounded-2xl shadow p-4">
        <h3 class="font-bold mb-3">اختر الوقت</h3>
        <div class="grid grid-cols-3 gap-2">
          <label class="border-2 border-sky-500 bg-sky-50 rounded-xl p-3 text-center cursor-pointer">
            <input type="radio" name="appointment_time" value="09:00" checked class="hidden">
            <span class="font-medium">9:00 ص</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="appointment_time" value="10:00" class="hidden">
            <span class="font-medium">10:00 ص</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="appointment_time" value="11:00" class="hidden">
            <span class="font-medium">11:00 ص</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="appointment_time" value="13:00" class="hidden">
            <span class="font-medium">1:00 م</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="appointment_time" value="14:00" class="hidden">
            <span class="font-medium">2:00 م</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="appointment_time" value="15:00" class="hidden">
            <span class="font-medium">3:00 م</span>
          </label>
        </div>
      </section>

      <!-- Insurance -->
      <section class="bg-white rounded-2xl shadow p-4">
        <h3 class="font-bold mb-3">التأمين</h3>
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-center gap-3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
          <div>
            <p class="font-medium">تم التحقق من التأمين</p>
            <p class="text-xs text-slate-600">شركة بوبا • رقم العضوية: BOUPA-XXXXXX</p>
          </div>
        </div>
      </section>

      <!-- Modality -->
      <section class="bg-white rounded-2xl shadow p-4">
        <h3 class="font-bold mb-3">نوع الزيارة</h3>
        <div class="grid grid-cols-2 gap-2">
          <label class="border-2 border-sky-500 bg-sky-50 rounded-xl p-3 text-center cursor-pointer">
            <input type="radio" name="modality" value="in_person" class="hidden">
            <span class="text-2xl block">🏥</span>
            <span class="text-sm font-medium mt-1 block">حضوري</span>
          </label>
          <label class="border-2 border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:border-sky-300">
            <input type="radio" name="modality" value="video" checked class="hidden">
            <span class="text-2xl block">📹</span>
            <span class="text-sm font-medium mt-1 block">عن بعد</span>
          </label>
        </div>
      </section>

      <!-- Submit -->
      <button type="submit" class="w-full bg-sky-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-sky-700">
        تأكيد الحجز
      </button>
    </form>
  </main>

  <script>
    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      alert('جاري الحجز... رقم التأكيد: APT-' + Date.now());
    });
  </script>
</body>
</html>
