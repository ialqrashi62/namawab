<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل حالة قصور القلب — HF Case Detail</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50">
  <header class="bg-white shadow border-b p-4">
    <h1 class="text-xl font-bold">تفاصيل حالة قصور القلب المتقدم</h1>
  </header>
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
        <h2 class="text-2xl font-bold mb-4">Patient Information</h2>
        <div class="grid grid-cols-2 gap-4">
          <div><span class="text-slate-600">Patient ID:</span> <strong id="patient-id">--</strong></div>
          <div><span class="text-slate-600">EF:</span> <strong id="ef-pct">--</strong></div>
          <div><span class="text-slate-600">NYHA:</span> <strong id="nyha">--</strong></div>
          <div><span class="text-slate-600">ACC Stage:</span> <strong id="stage">--</strong></div>
          <div><span class="text-slate-600">NT-proBNP:</span> <strong id="ntprobnp">--</strong></div>
          <div><span class="text-slate-600">INTERMACS:</span> <strong id="intermacs">--</strong></div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">GDMT 4-Pillar</h2>
        <div class="space-y-2">
          <div class="flex justify-between items-center p-2 rounded bg-slate-50"><span>ARNI</span><span id="arni-status">--</span></div>
          <div class="flex justify-between items-center p-2 rounded bg-slate-50"><span>Beta-blocker</span><span id="bb-status">--</span></div>
          <div class="flex justify-between items-center p-2 rounded bg-slate-50"><span>MRA</span><span id="mra-status">--</span></div>
          <div class="flex justify-between items-center p-2 rounded bg-slate-50"><span>SGLT2i</span><span id="sglt2i-status">--</span></div>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mt-4">
      <h2 class="text-xl font-bold mb-4">Decompensation History</h2>
      <table class="w-full">
        <thead class="bg-slate-50 border-b">
          <tr>
            <th class="px-4 py-2 text-right">Admitted</th>
            <th class="px-4 py-2 text-right">Weight</th>
            <th class="px-4 py-2 text-right">Diuretic Dose</th>
            <th class="px-4 py-2 text-right">Length of Stay</th>
            <th class="px-4 py-2 text-right">Outcome</th>
          </tr>
        </thead>
        <tbody id="admissions"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
