<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDMT 4-Pillar Optimization Form</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50">
  <header class="bg-blue-600 text-white p-4">
    <h1 class="text-2xl font-bold">GDMT 4-Pillar Optimization — تحسين العلاج</h1>
  </header>
  <main class="container mx-auto p-4 max-w-3xl">
    <form id="gdmt-form" class="bg-white rounded-lg shadow p-6">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium mb-1">Patient ID *</label>
          <input type="number" name="patient_id" required class="w-full px-3 py-2 border rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">EF % *</label>
          <input type="number" name="ef" min="0" max="100" required class="w-full px-3 py-2 border rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">NYHA Class *</label>
          <select name="nyha" required class="w-full px-3 py-2 border rounded">
            <option value="">--</option>
            <option value="1">I — No limitation</option>
            <option value="2">II — Slight limitation</option>
            <option value="3">III — Marked limitation</option>
            <option value="4">IV — Severe limitation</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Systolic BP (mmHg)</label>
          <input type="number" name="systolic_bp" required class="w-full px-3 py-2 border rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Heart Rate (bpm)</label>
          <input type="number" name="hr" required class="w-full px-3 py-2 border rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Potassium (mEq/L)</label>
          <input type="number" step="0.1" name="potassium" required class="w-full px-3 py-2 border rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">GFR (mL/min/1.73m²)</label>
          <input type="number" name="gfr" required class="w-full px-3 py-2 border rounded">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Current ARNI</label>
          <select name="current_arni" class="w-full px-3 py-2 border rounded">
            <option value="">None</option>
            <option value="24_26">24/26 mg BID</option>
            <option value="49_51">49/51 mg BID</option>
            <option value="97_103">97/103 mg BID</option>
          </select>
        </div>
      </div>
      <div class="mt-4">
        <h3 class="text-lg font-bold mb-3">GDMT 4-Pillar Eligibility Check</h3>
        <div class="grid grid-cols-2 gap-2" id="gdmt-pillars">
          <div class="p-3 rounded bg-slate-100"><span class="text-sm">ARNI (Sacubitril/Valsartan)</span></div>
          <div class="p-3 rounded bg-slate-100"><span class="text-sm">Beta-blocker</span></div>
          <div class="p-3 rounded bg-slate-100"><span class="text-sm">MRA (Spironolactone)</span></div>
          <div class="p-3 rounded bg-slate-100"><span class="text-sm">SGLT2i (Dapagliflozin)</span></div>
        </div>
      </div>
      <button type="submit" class="w-full mt-6 bg-blue-600 text-white px-6 py-3 rounded text-lg font-bold hover:bg-blue-700">Check Eligibility + Dose</button>
    </form>
  </main>
  <script>
    document.getElementById('gdmt-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      const r = await fetch('/api/ahf/gdmt/eligibility', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          ef: parseInt(data.ef),
          nyha: parseInt(data.nyha),
          systolic_bp: parseInt(data.systolic_bp),
          hr: parseInt(data.hr),
          potassium: parseFloat(data.potassium),
          gfr: parseFloat(data.gfr),
        }),
      });
      const j = await r.json();
      const pillars = ['arni', 'betablocker', 'mra', 'sglt2i'];
      const html = pillars.map(p => {
        const el = j.result.pillars[p];
        const color = el.eligible ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
        const status = el.eligible ? '✓ Eligible' : '✗ ' + el.reason;
        return `<div class="p-3 rounded ${color}"><span class="text-sm">${p.toUpperCase()}: ${status}</span></div>`;
      }).join('');
      document.getElementById('gdmt-pillars').innerHTML = html;
    });
  </script>
</body>
</html>
