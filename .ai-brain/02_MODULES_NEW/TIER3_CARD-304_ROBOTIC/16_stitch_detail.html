<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل حالة جراحة قلبية</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50">
  <header class="bg-white shadow border-b p-4">
    <h1 class="text-xl font-bold">Robotic CV Surgery Case Detail</h1>
  </header>
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
        <h2 class="text-2xl font-bold mb-4">Patient Information</h2>
        <div class="grid grid-cols-2 gap-4">
          <div><span class="text-slate-600">Patient ID:</span> <strong id="patient-id">--</strong></div>
          <div><span class="text-slate-600">Diagnosis:</span> <strong id="diagnosis">--</strong></div>
          <div><span class="text-slate-600">Procedure:</span> <strong id="procedure">--</strong></div>
          <div><span class="text-slate-600">Device:</span> <strong id="device">--</strong></div>
          <div><span class="text-slate-600">STS Score:</span> <strong id="sts">--</strong></div>
          <div><span class="text-slate-600">EF:</span> <strong id="ef">--</strong></div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">Risk Assessment</h2>
        <div class="text-center py-6">
          <div class="text-6xl font-bold" id="risk-level">--</div>
          <p class="text-sm text-slate-600 mt-2">STS Risk Level</p>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mt-4">
      <h2 class="text-xl font-bold mb-4">Pre-Op Checklist</h2>
      <div class="grid grid-cols-2 gap-2" id="checklist"></div>
    </div>
  </main>
</body>
</html>
