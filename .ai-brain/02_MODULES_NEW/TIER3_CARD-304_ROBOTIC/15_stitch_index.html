<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز جراحة القلب الروبوتية</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-white shadow border-b">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold">مركز جراحة القلب الروبوتية</h1>
      <span class="px-3 py-1 text-xs rounded-full bg-purple-100 text-purple-700">DaVinci + TAVI + MitraClip</span>
    </div>
  </header>
  <main class="container mx-auto p-4">
    <div class="mb-6">
      <h2 class="text-3xl font-bold mb-2">Robotic CV Surgery Center</h2>
      <p class="text-slate-600">Heart Team + STS Risk + DaVinci Robotic + TAVI/TAVR + MitraClip + WATCHMAN</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Pending Cases</h3>
        <p class="text-3xl font-bold" id="pending-cases">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Procedures (90d)</h3>
        <p class="text-3xl font-bold" id="proc-90d">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">TAVI Procedures</h3>
        <p class="text-3xl font-bold" id="tavi-count">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Conversion Rate</h3>
        <p class="text-3xl font-bold" id="conv-rate">--</p>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
      <h3 class="text-xl font-bold mb-4">Active Cases</h3>
      <table class="w-full">
        <thead class="bg-slate-50 border-b">
          <tr>
            <th class="px-4 py-2 text-right">Patient</th>
            <th class="px-4 py-2 text-right">Diagnosis</th>
            <th class="px-4 py-2 text-right">Procedure</th>
            <th class="px-4 py-2 text-right">STS</th>
            <th class="px-4 py-2 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="active-tbody"></tbody>
      </table>
    </div>
  </main>
  <script>
    fetch('/api/rcv/cases?limit=10').then(r => r.json()).then(d => {
      const tbody = document.getElementById('active-tbody');
      if (d.rows) {
        tbody.innerHTML = d.rows.map(c => `
          <tr class="border-b hover:bg-slate-50">
            <td class="px-4 py-2">Patient #${c.patient_id}</td>
            <td class="px-4 py-2">${c.diagnosis || '--'}</td>
            <td class="px-4 py-2">${c.procedure_type || '--'}</td>
            <td class="px-4 py-2">${c.sts_score || '--'}</td>
            <td class="px-4 py-2"><a href="/rcv/case/${c.id}" class="text-blue-600 hover:underline">عرض</a></td>
          </tr>
        `).join('');
      }
    });
  </script>
</body>
</html>
