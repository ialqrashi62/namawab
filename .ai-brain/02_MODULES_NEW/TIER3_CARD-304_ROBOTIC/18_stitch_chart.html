<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotic CV Quality Dashboard</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50">
  <header class="bg-white shadow border-b p-4">
    <h1 class="text-xl font-bold">Robotic CV Quality Dashboard</h1>
  </header>
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-bold mb-4">Procedures by Type (90d)</h3>
        <svg viewBox="0 0 400 200" class="w-full">
          <rect x="40" y="40" width="50" height="140" fill="#3b82f6"/>
          <rect x="100" y="60" width="50" height="120" fill="#10b981"/>
          <rect x="160" y="80" width="50" height="100" fill="#f59e0b"/>
          <rect x="220" y="100" width="50" height="80" fill="#8b5cf6"/>
          <rect x="280" y="120" width="50" height="60" fill="#ec4899"/>
          <text x="65" y="195" text-anchor="middle" font-size="11">Mitral</text>
          <text x="125" y="195" text-anchor="middle" font-size="11">TAVI</text>
          <text x="185" y="195" text-anchor="middle" font-size="11">CABG</text>
          <text x="245" y="195" text-anchor="middle" font-size="11">MitraClip</text>
          <text x="305" y="195" text-anchor="middle" font-size="11">WATCHMAN</text>
        </svg>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-bold mb-4">30-Day Outcomes</h3>
        <svg viewBox="0 0 400 200" class="w-full">
          <rect x="40" y="40" width="50" height="140" fill="#10b981"/>
          <rect x="100" y="60" width="50" height="120" fill="#84cc16"/>
          <rect x="160" y="80" width="50" height="100" fill="#facc15"/>
          <rect x="220" y="100" width="50" height="80" fill="#fb923c"/>
          <text x="65" y="195" text-anchor="middle" font-size="11">Success</text>
          <text x="125" y="195" text-anchor="middle" font-size="11">No Comp</text>
          <text x="185" y="195" text-anchor="middle" font-size="11">Survival</text>
          <text x="245" y="195" text-anchor="middle" font-size="11">Discharge</text>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
