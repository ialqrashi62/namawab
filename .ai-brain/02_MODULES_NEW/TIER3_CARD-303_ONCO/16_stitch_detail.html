<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardio-Onc Case Detail</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50">
  <header class="bg-white shadow border-b p-4">
    <h1 class="text-xl font-bold">Cardio-Onc Case Detail</h1>
  </header>
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="bg-white rounded-lg shadow p-6 lg:col-span-2">
        <h2 class="text-2xl font-bold mb-4">Patient Information</h2>
        <div class="grid grid-cols-2 gap-4">
          <div><span class="text-slate-600">Patient ID:</span> <strong id="patient-id">--</strong></div>
          <div><span class="text-slate-600">Cancer:</span> <strong id="cancer">--</strong></div>
          <div><span class="text-slate-600">Stage:</span> <strong id="stage">--</strong></div>
          <div><span class="text-slate-600">Therapy:</span> <strong id="therapy">--</strong></div>
          <div><span class="text-slate-600">Baseline EF:</span> <strong id="baseline-ef">--</strong></div>
          <div><span class="text-slate-600">Baseline GLS:</span> <strong id="baseline-gls">--</strong></div>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4">HFA-ICOS Risk</h2>
        <div class="text-center py-6">
          <div class="text-6xl font-bold" id="risk-level">--</div>
          <p class="text-sm text-slate-600 mt-2">Risk Category</p>
        </div>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between"><span>Score:</span><span id="risk-score">--</span></div>
          <div class="flex justify-between"><span>Recommendation:</span><span id="recommendation">--</span></div>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6 mt-4">
      <h2 class="text-xl font-bold mb-4">EF/GLS Trend</h2>
      <svg viewBox="0 0 800 200" class="w-full">
        <line x1="40" y1="180" x2="780" y2="180" stroke="#94a3b8"/>
        <line x1="40" y1="20" x2="40" y2="180" stroke="#94a3b8"/>
        <line x1="40" y1="60" x2="780" y2="60" stroke="#fca5a5" stroke-dasharray="4 2"/>
        <text x="50" y="55" font-size="10" fill="#dc2626">EF threshold 50%</text>
        <polyline points="50,40 100,50 150,55 200,60 250,70 300,90 350,110 400,130 450,150 500,160" fill="none" stroke="#3b82f6" stroke-width="2"/>
      </svg>
    </div>
  </main>
</body>
</html>
