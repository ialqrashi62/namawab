<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز قلب-أورام — Cardio-Oncology Center</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-white shadow border-b">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold">Cardio-Oncology Center</h1>
      <span class="px-3 py-1 text-xs rounded-full bg-pink-100 text-pink-700">HFA-ICOS Risk</span>
    </div>
  </header>
  <main class="container mx-auto p-4">
    <div class="mb-6">
      <h2 class="text-3xl font-bold mb-2">Cardio-Onc Dashboard</h2>
      <p class="text-slate-600">Cancer Therapy Cardiac Safety + VTE + Amyloid</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Active Cardio-Onc Cases</h3>
        <p class="text-3xl font-bold" id="active-cases">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Very High Risk</h3>
        <p class="text-3xl font-bold text-red-600" id="very-high">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">ICI Myocarditis (90d)</h3>
        <p class="text-3xl font-bold" id="ici-myocarditis">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">VTE on Chemo</h3>
        <p class="text-3xl font-bold" id="vte-on-chemo">--</p>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
      <h3 class="text-xl font-bold mb-4">Active Cases by Risk</h3>
      <table class="w-full">
        <thead class="bg-slate-50 border-b">
          <tr>
            <th class="px-4 py-2 text-right">Patient</th>
            <th class="px-4 py-2 text-right">Cancer</th>
            <th class="px-4 py-2 text-right">Therapy</th>
            <th class="px-4 py-2 text-right">HFA-ICOS Risk</th>
            <th class="px-4 py-2 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="active-tbody"></tbody>
      </table>
    </div>
  </main>
  <script>
    fetch('/api/coo/cases?limit=10').then(r => r.json()).then(d => {
      const tbody = document.getElementById('active-tbody');
      if (d.rows) {
        tbody.innerHTML = d.rows.map(c => `
          <tr class="border-b hover:bg-slate-50">
            <td class="px-4 py-2">Patient #${c.patient_id}</td>
            <td class="px-4 py-2">${c.cancer_type || '--'}</td>
            <td class="px-4 py-2">${c.cancer_therapy || '--'}</td>
            <td class="px-4 py-2"><span class="px-2 py-1 rounded ${c.hfa_icos_risk === 'very_high' ? 'bg-red-100 text-red-700' : (c.hfa_icos_risk === 'high' ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700')}">${c.hfa_icos_risk || '--'}</span></td>
            <td class="px-4 py-2"><a href="/coo/case/${c.id}" class="text-blue-600 hover:underline">عرض</a></td>
          </tr>
        `).join('');
      }
    });
  </script>
</body>
</html>
