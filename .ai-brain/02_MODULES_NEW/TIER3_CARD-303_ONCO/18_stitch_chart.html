<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardio-Onc Quality Dashboard</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50">
  <header class="bg-white shadow border-b p-4">
    <h1 class="text-xl font-bold">Cardio-Onc Quality Dashboard</h1>
  </header>
  <main class="container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-bold mb-4">HFA-ICOS Risk Distribution</h3>
        <svg viewBox="0 0 400 200" class="w-full">
          <rect x="50" y="100" width="60" height="80" fill="#10b981"/>
          <rect x="120" y="60" width="60" height="120" fill="#84cc16"/>
          <rect x="190" y="40" width="60" height="140" fill="#facc15"/>
          <rect x="260" y="20" width="60" height="160" fill="#ef4444"/>
          <text x="80" y="195" text-anchor="middle" font-size="11">Low</text>
          <text x="150" y="195" text-anchor="middle" font-size="11">Moderate</text>
          <text x="220" y="195" text-anchor="middle" font-size="11">High</text>
          <text x="290" y="195" text-anchor="middle" font-size="11">Very High</text>
        </svg>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-lg font-bold mb-4">Cardiotoxicity by Therapy</h3>
        <svg viewBox="0 0 400 200" class="w-full">
          <rect x="50" y="40" width="60" height="140" fill="#ef4444"/>
          <rect x="120" y="80" width="60" height="100" fill="#facc15"/>
          <rect x="190" y="100" width="60" height="80" fill="#84cc16"/>
          <rect x="260" y="120" width="60" height="60" fill="#10b981"/>
          <text x="80" y="195" text-anchor="middle" font-size="11">Anthracycl.</text>
          <text x="150" y="195" text-anchor="middle" font-size="11">Trastuzumab</text>
          <text x="220" y="195" text-anchor="middle" font-size="11">ICI</text>
          <text x="290" y="195" text-anchor="middle" font-size="11">VEGF</text>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
