name: CI-CD-Stroke-Center

on:
  push:
    branches: [main, integration/*, audit/*]
    paths:
      - 'namaweb/**'
      - '.ai-brain/02_MODULES_NEW/TIER3_CARD-301_STROKE/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd namaweb && npm ci
      - run: cd namaweb && npm test -- --grep "stroke"
      - name: Security scan
        run: |
          cd namaweb
          npm audit --audit-level=high
          node -e "require('./tier3_card_301_stroke_engine.js')"

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/audit/phase-1a-critical-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          scp -o StrictHostKeyChecking=no -i ${{ secrets.DEPLOY_KEY }} \
            namaweb/tier3_card_301_stroke_engine.js namaweb/stroke_router.js \
            root@staging.jumanasoft.com:/var/www/namaweb/
          ssh -i ${{ secrets.DEPLOY_KEY }} root@staging.jumanasoft.com \
            "cd /var/www/namaweb && pm2 reload stroke-center --silent"

  deploy-prod:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to prod
        run: |
          scp -o StrictHostKeyChecking=no -i ${{ secrets.DEPLOY_KEY }} \
            namaweb/tier3_card_301_stroke_engine.js namaweb/stroke_router.js \
            root@204.168.144.74:/var/www/namaweb/
          ssh -i ${{ secrets.DEPLOY_KEY }} root@204.168.144.74 \
            "cd /var/www/namaweb && pm2 reload stroke-center --silent"
