<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز السكتة الدماغية — NamaMedical</title>
  <meta name="description" content="Stroke Center — Comprehensive stroke care from acute to rehabilitation">
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50 text-slate-900" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-white shadow border-b">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold">مركز السكتة الدماغية</h1>
      <span class="px-3 py-1 text-xs rounded-full bg-red-100 text-red-700">Code Stroke Active</span>
    </div>
  </header>
  <main class="container mx-auto p-4">
    <div class="mb-6">
      <h2 class="text-3xl font-bold mb-2">Stroke Center Dashboard</h2>
      <p class="text-slate-600">Acute stroke care pathway with telestroke support</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Door-to-Needle (متوسط)</h3>
        <p class="text-3xl font-bold" id="dnt-avg">--</p>
        <p class="text-xs text-green-600">Target: ≤60 min</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Door-to-Groin (متوسط)</h3>
        <p class="text-3xl font-bold" id="dtg-avg">--</p>
        <p class="text-xs text-green-600">Target: ≤90 min</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Cases (30 يوم)</h3>
        <p class="text-3xl font-bold" id="cases-30d">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">mRS 0-2 @ 30d</h3>
        <p class="text-3xl font-bold" id="favorable-outcome">--</p>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
      <h3 class="text-xl font-bold mb-4">Active Cases</h3>
      <table class="w-full">
        <thead class="bg-slate-50 border-b">
          <tr>
            <th class="px-4 py-2 text-right">Patient</th>
            <th class="px-4 py-2 text-right">NIHSS</th>
            <th class="px-4 py-2 text-right">Type</th>
            <th class="px-4 py-2 text-right">TLKW</th>
            <th class="px-4 py-2 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="active-cases">
        </tbody>
      </table>
    </div>
  </main>
  <script>
    fetch('/api/stroke/cases?limit=10').then(r => r.json()).then(d => {
      const tbody = document.getElementById('active-cases');
      if (d.rows) {
        tbody.innerHTML = d.rows.map(c => `
          <tr class="border-b hover:bg-slate-50">
            <td class="px-4 py-2">Patient #${c.patient_id}</td>
            <td class="px-4 py-2"><span class="px-2 py-1 rounded ${c.nihss_score >= 16 ? 'bg-red-100 text-red-700' : (c.nihss_score >= 6 ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700')}">${c.nihss_score || '--'}</span></td>
            <td class="px-4 py-2">${c.stroke_type || '--'}</td>
            <td class="px-4 py-2">${c.last_known_well ? new Date(c.last_known_well).toLocaleString('ar-SA') : '--'}</td>
            <td class="px-4 py-2"><a href="/stroke/case/${c.id}" class="text-blue-600 hover:underline">عرض</a></td>
          </tr>
        `).join('');
      }
    });
  </script>
</body>
</html>
