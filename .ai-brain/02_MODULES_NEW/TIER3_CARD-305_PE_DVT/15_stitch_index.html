<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PE/DVT Response Team</title>
  <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-slate-50" style="font-family: 'Cairo', 'Inter', system-ui, sans-serif;">
  <header class="bg-red-600 text-white p-4">
    <div class="container mx-auto px-4 py-2 flex justify-between items-center">
      <h1 class="text-xl font-bold">�️ PE/DVT Response Team — PERT</h1>
      <span class="px-3 py-1 text-xs rounded-full bg-white text-red-600">Emergency</span>
    </div>
  </header>
  <main class="container mx-auto p-4">
    <div class="mb-6">
      <h2 class="text-3xl font-bold mb-2">PE/DVT Dashboard</h2>
      <p class="text-slate-600">PERT Activation + Risk Stratification + Treatment</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Active PE Cases</h3>
        <p class="text-3xl font-bold" id="active-cases">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">Massive PE (90d)</h3>
        <p class="text-3xl font-bold text-red-600" id="massive-pe">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">PERT Activations</h3>
        <p class="text-3xl font-bold" id="pert-acts">--</p>
      </div>
      <div class="bg-white rounded-lg shadow p-4">
        <h3 class="text-sm text-slate-600">30d Mortality</h3>
        <p class="text-3xl font-bold" id="mortality-30d">--</p>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
      <h3 class="text-xl font-bold mb-4">Active PE Cases by Severity</h3>
      <table class="w-full">
        <thead class="bg-slate-50 border-b">
          <tr>
            <th class="px-4 py-2 text-right">Patient</th>
            <th class="px-4 py-2 text-right">Severity</th>
            <th class="px-4 py-2 text-right">sPESI</th>
            <th class="px-4 py-2 text-right">SBP</th>
            <th class="px-4 py-2 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="active-tbody"></tbody>
      </table>
    </div>
  </main>
  <script>
    fetch('/api/pedvt/cases?limit=10').then(r => r.json()).then(d => {
      const tbody = document.getElementById('active-tbody');
      if (d.rows) {
        tbody.innerHTML = d.rows.map(c => `
          <tr class="border-b hover:bg-slate-50">
            <td class="px-4 py-2">Patient #${c.patient_id}</td>
            <td class="px-4 py-2"><span class="px-2 py-1 rounded ${c.severity === 'massive' ? 'bg-red-100 text-red-700' : (c.severity === 'intermediate_high' ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700')}">${c.severity || '--'}</span></td>
            <td class="px-4 py-2">${c.biomarker_positive ? '+' : '-'}</td>
            <td class="px-4 py-2">${c.sbp || '--'}</td>
            <td class="px-4 py-2"><a href="/pedvt/case/${c.id}" class="text-blue-600 hover:underline">عرض</a></td>
          </tr>
        `).join('');
      }
    });
  </script>
</body>
</html>
