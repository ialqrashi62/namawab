# Roll-up
total_estimated_tokens_all_phases: 15_400_000
total_estimated_files_all_phases: 503

# Hard stop rules
hard_stops:
  - "Session > 2.5M tokens → write closeout, return control to owner"
  - "Single file > 2,000 lines → split (per prompt §1: 'إذا كان الملف > 500 سطر، قسّمه' — using 2,000 as a hard cap, with 500 as the soft target)"
  - "Hardcoded secret, key, token, or PHI in any tracked file → revert + write finding to .ai-brain/findings/"
  - "Any edit to namaweb/, namaweb-ovr-audit-independent/, ops/live_deploy/ WITHOUT owner authorization → revert + escalate"
  - "Any push to a remote without owner authorization → revert + escalate"
  - "Any merge to main / integration/* / audit/* without owner authorization → revert + escalate"
