# Date:   2026-07-24
# Owner:  user (approval required between phases, per AGENTS.md §3 + .ai_rules §4)
#
# This file is the per-phase token budget FOR THE NEW LAYOUT ONLY.
# The existing .ai-brain/00_SYSTEM/03_AUTOPILOT/ directory has its own
# budget governed by .ai-brain/00_SYSTEM/PROMPT_ENGINE_v2.yaml and
# .ai-brain/LOOP_ENGINEERING_PLAYBOOK.md. Do not touch that file.

version: 1.0
as_of: 2026-07-24
currency: "tokens (rough equivalent; actual cost in USD)"

# Cap per session (one phase per session, per .ai_rules §4)
session:
  hard_cap_tokens: 2_000_000          # ~2M tokens / session
  soft_warning_tokens: 1_500_000
  hard_stop_tokens: 2_500_000
  reserved_for_state_writes: 25_000
  reserved_for_closeout: 25_000

# Per-phase allocation (only Phase 0 is unlocked)
phases:
  P0_init:
    id: "P0-INIT"
    name: "Initialization and structure"
    status: "in_progress"
    budget_tokens: 250_000
    spent_tokens: 0                    # session estimate, will be backfilled
    deliverables:
      - ".ai-brain/99-state/current-phase.json"
      - ".ai-brain/00-orchestrator/MASTER-PROMPT.md"
      - ".ai-brain/01-requirements/medical-departments-tree.yaml"
      - ".ai-brain/00-orchestrator/TOKEN-BUDGET.yaml (this file)"
      - ".ai-brain/.gitignore"
      - ".ai-brain/README.md"
      - ".ai-brain/DECISIONS_PENDING.md"
    unlock: "owner"                     # already issued 2026-07-24
    next_unlock_required_from: "owner"

  P1_database:
    id: "P1-DB"
    name: "Database + ERD (38 depts, PostgreSQL DDL)"
    status: "blocked"
    blocked_by:
