    snomed_domain: 50043002 |Disorder of respiratory system|
    compliance: [GOLD, GINA, ATS/ERS, NPHIES-Respiratory]
    stitch_layout: B
    red_flags: [Massive PE, Tension Pneumothorax, Status Asthmaticus, ARDS, Hemoptysis-massive]

