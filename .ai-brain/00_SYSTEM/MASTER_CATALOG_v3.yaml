# ============================================================
# NamaMedical — MASTER_CATALOG v3
# فهرس 100+ قسم سريري / إداري / تشغيلي
# مصدر الحقيقة لتوليد .ai-brain docs عبر nm-7-expert-panel + nm-autopilot
# ============================================================
#
# convention:
#   id:         معرف فريد ثابت
#   name_ar:    الاسم بالعربي
#   name_en:    الاسم بالإنجليزي
#   group:      المجموعة الكبرى
#   tier:       1=أساسي / 2=متقدم / 3=متخصص / 4=نادر
#   subs:       قائمة الأقسام الفرعية (sub-units)
#   primary_tables: الجداول الأساسية المتوقعة في DB
#   key_apis:   أهم API endpoints
#   icd10_chapter: فصل ICD-10 المرجعي
#   snomed_domain: نطاق SNOMED CT
#   compliance: علامات الامتثال المطلوبة
#   stitch_layout: تخطيط Stitch المقترح (A-H)
#   red_flags:  أهم الطوارئ / red flags
#   notes:      ملاحظات خاصة
# ============================================================

meta:
  version: 3.0
  date: 2026-07-27
  total_top_groups: 10
  total_departments: 100+
  total_sub_units: 350+
  source: PROMPT_v4_2026-07-27
  consumption_target: <= 800 tokens per single dept generation
  language: AR primary, EN secondary
  region: KSA primary, GCC ready

# ============================================================
# 1) الباطنية (Internal Medicine)
# ============================================================
internal_medicine:
  cardiology:
    id: CARD-001
    name_ar: قسم طب القلب العام
    name_en: Cardiology
    group: internal_medicine
    tier: 1
    subs:
      - id: CARD-002
        name_ar: طب القلب التداخلي
        name_en: Interventional Cardiology
        subs: [Cath Lab, PCI, TAVR, MitraClip, Watchman, ASD/PFO Closure]
      - id: CARD-003
        name_ar: طب القلب الإلكتروفيزيولوجي
        name_en: Electrophysiology
        subs: [Ablation, Pacemaker, ICD, CRT, Leadless Pacemaker]
      - id: CARD-004
        name_ar: طب القلب الوقائي
        name_en: Preventive Cardiology
        subs: [Lipid Clinic, HTN Clinic, Cardiac Rehab]
      - id: CARD-005
        name_ar: طب القلب النووي
        name_en: Nuclear Cardiology
        subs: [SPECT MPI, PET MPI, MUGA]
      - id: CARD-006
        name_ar: طب القلب للحوامل
        name_en: Cardio-Obstetrics
        subs: [High-Risk Pregnancy Cardio, PPCM]
      - id: CARD-007
        name_ar: قسطرة القلب
        name_en: Cardiac Catheterization Lab
        subs: [Diagnostic Cath, PCI, FFR/iFR, IVUS/OCT]
      - id: CARD-008
        name_ar: أمراض الشرايين الطرفية
        name_en: Peripheral Vascular Disease
        subs: [PVI, Atherectomy, CLI, Wound Care]
      - id: CARD-009
        name_ar: الفشل القلبي المتقدم
        name_en: Advanced Heart Failure
        subs: [LVAD, Transplant, CardioMEMS, IV Diuresis Clinic]
    primary_tables: [patients, encounters, ecg_records, echo_reports, holter_reports, stress_tests, cardiac_cath_reports, pci_procedures, device_implants, cardiac_rehab_plans]
    key_apis: [/api/cardiology/encounters, /api/cardiology/ecg, /api/cardiology/echo, /api/cardiology/cath, /api/cardiology/devices, /api/cardiology/medications]
    icd10_chapter: I00-I99 (Cardiovascular)
    snomed_domain: 113257007 |Disorder of cardiovascular system|
    compliance: [JCI-ACC, ESC, AHA, NPHIES-Cardiology-Bundle, SFDA]
    stitch_layout: B
    red_flags: [STEMI, NSTEMI-high-risk, Aortic Dissection, PE, Cardiac Tamponade, SCD-risk]
    notes: High integration with ER (CODE STEMI), ICU, Radiology

  pulmonology:
    id: PULM-001
    name_ar: قسم طب الصدر والجهاز التنفسي
    name_en: Pulmonology
