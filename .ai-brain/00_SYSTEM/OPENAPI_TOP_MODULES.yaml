# OpenAPI 3.0 specs for the most critical modules
# Generated by nm-ai-brain-department-generator
# Source: route_schemas.js + server.js

openapi: 3.0.3
info:
  title: NamaMedical (jumanasoft.com) Hospital OS API
  version: 1.0.0
  description: |
    Hospital OS API for the Kingdom of Saudi Arabia.
    60+ clinical + admin + support departments.
    Multi-tenant · RLS · ZATCA · NPHIES · CBAHI · PDPL · HIPAA-aligned.
  contact:
    name: jumanaSoft
    url: https://jumanasoft.com
servers:
  - url: https://jumanasoft.com/api
    description: Production
  - url: http://localhost:3000/api
    description: Local dev

security:
  - sessionAuth: []
  - bearerAuth: []

tags:
  - name: Patients
    description: Patient demographics + chart
  - name: Encounters
    description: OPD/IPD visits
  - name: Clinical
    description: Notes, problems, plans
  - name: Pharmacy
    description: Outpatient + inpatient + controlled
  - name: Lab
    description: Orders, specimens, results
  - name: Radiology
    description: Orders, worklist, DICOM, reports
  - name: Surgery
    description: OR, pre-op, post-op, anesthesia
  - name: ER
    description: Emergency department
  - name: Oncology
    description: Regimens, cycles, genomics
  - name: Cardiology
    description: ECG, cath, echo, HF risk
  - name: ICU
    description: Critical care monitoring
  - name: OB/GYN + Peds
    description: Pregnancy, delivery, neonatal
  - name: Pathology
    description: Specimens, blocks, slides, reports
  - name: Billing
    description: Invoices, payments, refunds
  - name: Insurance
    description: Claims, pre-auth, NPHIES
  - name: ZATCA
    description: Saudi e-invoicing
  - name: HR
    description: Employees, attendance
  - name: Inventory
    description: Stock, purchase orders
  - name: Maintenance
    description: Equipment, work orders
  - name: Quality
    description: Incidents, CAPA, KPIs
  - name: Infection
    description: Surveillance, outbreaks, isolation
  - name: AI
    description: Orchestrators + voice dictation + CDS-hooks
  - name: Admin
    description: Settings, users, integrations

paths:

  /patients:
    post:
      tags: [Patients]
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

