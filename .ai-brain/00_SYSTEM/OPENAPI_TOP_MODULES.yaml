components:

  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: nama.sid
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden (RBAC)

  schemas:

    # Common
    ValidationError:
      type: object
      properties:
        error:
          type: string
        field:
          type: string

    # Patient
    PatientCreate:
      type: object
      required: [mrn, given_name, family_name, gender, dob]
      properties:
        mrn:
          type: string
          maxLength: 64
        given_name:
          type: string
          maxLength: 200
        family_name:
          type: string
          maxLength: 200
        gender:
          type: enum
          values: [M, F, Other]
        dob:
          type: string
          format: date
        national_id:
          type: string
          maxLength: 20
        phone:
          type: string
        email:
          type: string

    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientCreate'
        - type: object
          properties:
            id: { type: integer }
            tenant_id: { type: integer }
            created_at: { type: string, format: date-time }

    PatientConsentCreate:
      type: object
      required: [consent_type]
      properties:
        consent_type:
          type: enum
          values: [general, surgical, anesthesia, research, data-sharing, other]
        signature_data:
          type: string
          maxLength: 200000
        expiration_date:
          type: string
          format: date

    # Encounter
    EncounterSign:
      type: object
      properties:
        signature_data:
          type: string
        notes:
          type: string

    # Clinical
    ClinicalNoteUpsert:
      type: object
      required: [patient_id, note_type, body]
      properties:
        patient_id: { type: integer }
        encounter_id: { type: integer }
        note_type:
          type: enum
          values: [progress, admission, discharge, consult, procedure, other]
        template_id: { type: integer }
        body:
          type: string
          maxLength: 50000
        subjective: { type: string }
        objective: { type: string }
        assessment: { type: string }
        plan: { type: string }

    ClinicalNoteLock:
      type: object
      properties:
        lock_reason:
          type: string
          maxLength: 1000

    # Pharmacy
    PrescriptionCreate:
      type: object
      required: [patient_id, medication_name, dose, route, frequency]
      properties:
        patient_id: { type: integer }
        encounter_id: { type: integer }
        medication_name: { type: string }
        dose: { type: string }
        route: { type: enum, values: [PO, IV, IM, SC, topical, inhaled, other] }
        frequency: { type: string }
        duration_days: { type: integer }
        refills: { type: integer }
        notes: { type: string }

    PharmacyDispense:
      type: object
      required: [prescription_id, qty]
      properties:
        prescription_id: { type: integer }
        qty: { type: integer }
        batch_number: { type: string }
        expiry_date: { type: string, format: date }
        counseling_notes: { type: string }

    PharmacyWasfatyDispenseIntent:
      type: object
      required: [patient_id, medication_name]
      properties:
        patient_id: { type: integer }
        medication_name: { type: string }
        dose: { type: string }
        quantity: { type: integer }
        pharmacy_nphies_id: { type: string }

    # Lab
    LabOrderCreate:
      type: object
      required: [patient_id, test_code]
      properties:
        patient_id: { type: integer }
        encounter_id: { type: integer }
        test_code: { type: string }
        priority:
          type: enum
          values: [routine, urgent, stat]
        clinical_info: { type: string }

    LabResultCreate:
      type: object
      required: [order_id, value, units]
      properties:
        order_id: { type: integer }
        value: { type: string }
        units: { type: string }
        reference_range: { type: string }
        abnormal_flag: { type: string }

    LabResultVerify:
      type: object
      properties:
        verified_by: { type: integer }
        notes: { type: string }

    # Radiology
    RadiologyReportCreate:
      type: object
      required: [order_id, findings, impression]
      properties:
        order_id: { type: integer }
        findings: { type: string }
        impression: { type: string }
        recommendations: { type: string }

    RadiologyReportSign:
      type: object
      properties:
        signature_data: { type: string }
        notes: { type: string }

    # Surgery
    SurgeryCreate:
      type: object
      required: [patient_id, surgery_type]
      properties:
        patient_id: { type: integer }
        encounter_id: { type: integer }
        surgery_type: { type: string }
        scheduled_date: { type: string, format: date }
        urgency:
          type: enum
          values: [elective, urgent, emergency]
        surgeon_id: { type: integer }

    OrSlotReserve:
      type: object
      required: [room_id, slot_start, slot_end]
      properties:
        room_id: { type: integer }
        slot_start: { type: string, format: date-time }
        slot_end: { type: string, format: date-time }
        surgery_id: { type: integer }

    OrWhoChecklist:
      type: object
      required: [phase, items]
      properties:
        phase:
          type: enum
          values: [sign-in, time-out, sign-out]
        items: { type: string }
        confirmed_by: { type: string }

    # ER
    ErTriage:
      type: object
      required: [patient_id, triage_level, chief_complaint]
      properties:
        patient_id: { type: integer }
        triage_level:
          type: enum
          values: [ESI-1, ESI-2, ESI-3, ESI-4, ESI-5]
        chief_complaint: { type: string }
        arrival_time: { type: string, format: date-time }

    ErDisposition:
      type: object
      required: [encounter_id, disposition]
      properties:
        encounter_id: { type: integer }
        disposition:
          type: enum
          values: [discharge, admit, transfer, observation, ama, expired]

    # ADT
    AdtAdmit:
      type: object
      required: [patient_id]
      properties:
        patient_id: { type: integer }
        bed_id: { type: integer }
        admission_type:
          type: enum
          values: [elective, emergency, urgent, observation]
        attending_doctor_id: { type: integer }

    AdtDischarge:
      type: object
      required: [encounter_id]
      properties:
        encounter_id: { type: integer }
        discharge_type:
          type: enum
          values: [home, transfer, ama, expired, against_advice]

    # Oncology
    OncologyRegimenCreate:
      type: object
      required: [patient_id, regimen_name]
      properties:
        patient_id: { type: integer }
        regimen_name: { type: string }
        cycle_number: { type: integer }
        start_date: { type: string, format: date }

    # Billing
    InvoiceCreate:
      type: object
      required: [patient_id, line_items]
      properties:
        patient_id: { type: integer }
        line_items:
          type: array
          items:
            type: object
            properties:
              service_code: { type: string }
              qty: { type: integer }
              unit_price: { type: number }
        discount: { type: number }
        tax_rate: { type: number }

    InvoicePay:
      type: object
      required: [amount]
      properties:
        amount: { type: number }
        payment_method:
          type: enum
          values: [cash, card, bank-transfer, insurance, other]
        reference: { type: string }

    # Insurance
    InsuranceClaimCreate:
      type: object
      required: [patient_id, payer_id, total]
      properties:
        patient_id: { type: integer }
        payer_id: { type: integer }
        invoice_id: { type: integer }
        total: { type: number }
        line_items: { type: array }

    NphiesClaimSubmit:
      type: object
      properties:
        submission_notes: { type: string }
        force_submit: { type: boolean }

    # ZATCA
    ZatcaGenerate:
      type: object
      required: [invoice_id]
      properties:
        invoice_id: { type: integer }
        format:
          type: enum
          values: [xml, json, pdf]

    ZatcaCreditNote:
      type: object
      required: [invoice_id]
      properties:
        invoice_id: { type: integer }
        reason: { type: string }
        amount: { type: number }

    # AI
    AiOrchestratorInvoke:
      type: object
      required: [patient_id]
      properties:
        patient_id: { type: integer }
        context: { type: string }

    CdsHookInvoke:
      type: object
      required: [hook]
      properties:
        hook:
          type: enum
          values: [patient-view, medication-prescribe, order-select, order-sign]
        hookInstance: { type: string }
        context: { type: string }
        patientId: { type: integer }

    VoiceDictationStart:
      type: object
      required: [patientId]
      properties:
        patientId: { type: integer }
        encounterId: { type: integer }
        language:
          type: enum
          values: [ar-SA, en-US, fr-FR, ur-PK]

    VoiceDictationFinalize:
      type: object
      properties:
        transcript: { type: string }
        encounterId: { type: integer }

    # Infection
    InfectionSurveillanceCreate:
      type: object
      properties:
        patient_id: { type: integer }
        organism: { type: string }
        infection_type:
          type: enum
          values: [hai, hai-uti, hai-ssi, hai-pneumonia, hai-bsi, c-diff, mrsa, vre, other]

    InfectionOutbreakCreate:
      type: object
      required: [outbreak_name]
      properties:
        outbreak_name: { type: string }
        suspected_source: { type: string }
        case_count: { type: integer }

    # Quality
    QualityIncidentCreate:
      type: object
      required: [incident_date, incident_type]
      properties:
        incident_date: { type: string, format: date }
        incident_type:
          type: enum
          values: [patient-safety, medication-error, fall, equipment, documentation, near-miss, other]
        severity:
          type: enum
          values: [low, moderate, high, critical, sentinel]
        description: { type: string }
        patient_id: { type: integer }

    # Maintenance
    MaintenanceWorkOrderCreate:
      type: object
      required: [work_type, description]
      properties:
        equipment_id: { type: integer }
        work_type:
          type: enum
