# filepath: .ai-brain/07-devops/monitoring/prometheus.yml
# Generated 2026-08-08
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: nama-medical-backend
    static_configs:
  - targets: ['backend:3000']
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
  - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
  - targets: ['redis-exporter:9121']
