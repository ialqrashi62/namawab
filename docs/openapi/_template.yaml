openapi: 3.1.0
info:
  title: NamaMedical — {{Department Name}} API
  version: 0.1.0
  description: |
    {{Department Name}} service.
    Inherits common schemas from `components.base.yaml`.

servers:
  - url: https://api.nama.local
  - url: https://staging-api.nama.local

tags:
  - { name: orders }
  - { name: results }
  - { name: ai }

paths:

  /api/v1/{{dept_key}}/orders:
    get:
      tags: [orders]
      parameters:
        - { $ref: 'components.base.yaml#/components/parameters/PageSize' }
        - { $ref: 'components.base.yaml#/components/parameters/PageToken' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeptOrder' } }
                  meta: { $ref: 'components.base.yaml#/components/schemas/PageMeta' }
    post:
      tags: [orders]
      security: [{ bearerAuth: [order.write] }]
      parameters:
        - { $ref: 'components.base.yaml#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeptOrderInput' }
      responses:
        '201':
          content: { application/json: { schema: { $ref: '#/components/schemas/DeptOrder' } } }

  /api/v1/{{dept_key}}/results:
    get:
      tags: [results]
      parameters:
        - in: query
          name: patient_id
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: 'components.base.yaml#/components/schemas/Result' }

  /api/v1/{{dept_key}}/ai/ask:
    post:
      tags: [ai]
      security: [{ bearerAuth: [ai.use] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: 'components.base.yaml#/components/schemas/AIRequest' }
      responses:
        '200':
          content: { application/json: { schema: { $ref: 'components.base.yaml#/components/schemas/AIResponse' } } }

components:
  schemas:
    DeptOrderInput:
      type: object
      required: [patient_id, type]
      properties:
        patient_id: { type: string }
        type:       { type: string }
        priority:   { type: string, enum: [routine, urgent, stat, emergent] }
        notes:      { type: string }

    DeptOrder:
      allOf:
        - { $ref: '#/components/schemas/DeptOrderInput' }
        - type: object
          properties:
            id:         { type: string, format: uuid }
            status:     { type: string }
            ordered_at: { type: string, format: date-time }

  securitySchemes:
    bearerAuth: { $ref: 'components.base.yaml#/components/securitySchemes/bearerAuth' }

security: [{ bearerAuth: [] }]
