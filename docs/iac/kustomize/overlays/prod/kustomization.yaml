apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nama-prod
namePrefix: prd-

resources:
  - ../../base

patches:
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: HorizontalPodAutoscaler }
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 20

configMapGenerator:
  - name: nama-env
    behavior: merge
    literals:
      - NAMA_ENV=prod
      - LOG_LEVEL=WARN
      - PHI_REDACTION=strict
