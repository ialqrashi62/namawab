# NamaMedical — Python project template
# Copy to each Python service root and customize [project].name

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nama-service-template"
version = "0.1.0"
description = "NamaMedical service template"
requires-python = ">=3.12"
authors = [{ name = "NamaMedical Platform" }]
license = { text = "Proprietary — NamaMedical" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyodbc>=5.1",
  "redis>=5.0",
  "qdrant-client>=1.10",
  "langchain>=0.2",
  "langgraph>=0.2",
  "langchain-anthropic>=0.1",
  "openai>=1.40",
  "tenacity>=8.4",
  "structlog>=24.2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "prometheus-client>=0.20",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pre-commit>=3.7",
  "ipython>=8.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ASYNC", "C4", "T20"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=. --cov-report=term --cov-report=xml --cov-fail-under=75"
asyncio_mode = "auto"
markers = [
  "integration: requires external services (mssql, qdrant, redis)",
  "slow: takes more than 5 seconds",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
